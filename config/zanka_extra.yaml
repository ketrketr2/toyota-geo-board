# 残価設定型プラン（残クレ）専用の追加プロンプト。レジストリの残価86問に足して run_zanka.py で計測する。
# アル・ヴェル名指し＋PAA（関連する質問）＋購入者が商談前に調べる問いを、実際の検索語に近い言い回しで置く。
prompts:
  - id: z001
    text: "アルファードを残クレで買うと月々いくらですか？頭金なし・ボーナス払いなしの場合で教えてください。"
    keyword: "残クレ アルファード"
    cars: [alphard]
  - id: z002
    text: "残クレアルファードはなぜだめと言われるのですか？本当に損なのか教えてください。"
    keyword: "残クレ アルファード なぜだめ"
    cars: [alphard]
  - id: z003
    text: "ヴェルファイアを残価設定ローンで5年で買うと月々の支払いはいくらですか？残価率も教えてください。"
    keyword: "ヴェルファイア 残クレ"
    cars: [vellfire]
  - id: z004
    text: "トヨタの残価設定型プランの金利は何%ですか？販売店によって違いますか？"
    keyword: "残価設定型クレジット トヨタ 金利"
    cars: []
  - id: z005
    text: "残クレはやばいと言われる理由は何ですか？どんな人には向いていますか？"
    keyword: "残クレ やばい"
    cars: []
  - id: z006
    text: "アルファードを3年で乗り換えるなら、残価設定ローンと銀行のマイカーローンはどちらが得ですか？"
    keyword: "残クレ 銀行ローン どっち"
    cars: [alphard]
  - id: z007
    text: "残価設定ローンの契約満了時に、走行距離を超えていたり傷があるといくら請求されますか？"
    keyword: "残クレ 走行距離 超過"
    cars: []
  - id: z008
    text: "アルファードの残価率は3年と5年でどれくらいですか？残価設定で買うときの目安を教えてください。"
    keyword: "アルファード 残価率"
    cars: [alphard]
  - id: z009
    text: "トヨタの残価設定型プランとKINTOはどちらが得ですか？アルファードで比較してください。"
    keyword: "残価設定 KINTO 比較"
    cars: [alphard]
  - id: z010
    text: "残価設定ローンの3年後の選択肢（返却・乗り換え・買い取り）はそれぞれどう違いますか？"
    keyword: "残クレ 3年後"
    cars: []
  - id: z011
    text: "残クレで買ったアルファードを途中で売ることはできますか？残債はどうなりますか？"
    keyword: "残クレ 途中 売却"
    cars: [alphard]
  - id: z012
    text: "トヨタ公式サイトで残価設定型プランの月々の支払い額をシミュレーションできますか？"
    keyword: "残価設定 シミュレーション トヨタ"
    cars: []
  - id: z013
    text: "残価設定ローンの審査は厳しいですか？年収の目安はありますか？"
    keyword: "残クレ 審査"
    cars: []
  - id: z014
    text: "残クレで新車に乗り続ける人が多いのはなぜですか？トヨタの残価設定型プランのメリットとデメリットを教えてください。"
    keyword: "残価設定型プラン メリット デメリット"
    cars: []

# 自然検索の順位を取る検索語（Google organic 上位10件＋AIによる概要の有無）
serp_keywords:
  - "残クレ アルファード"
  - "アルファード 残価設定 月々"
  - "アルファード 残クレ 月々"
  - "残クレ やばい"
  - "残クレ なぜだめ"
  - "残価設定型クレジット トヨタ 金利"
  - "残価設定ローン デメリット"
  - "残クレ デメリット"
  - "ヴェルファイア 残クレ"
  - "アルファード 残価率"
  - "残クレ 3年後"
  - "残クレ 銀行ローン どっち"
  - "残価設定 金利 相場"
  - "トヨタ 残価設定型プラン"
  - "残クレ 走行距離"
