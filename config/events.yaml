# ============================================================
#  イベント連動クエリ
#
#  クエリの需要は平常時のトレンドだけでは動かない。
#  「残クレでアルファードを買うのは危ないらしい」のような突発的な炎上、
#  新型車の発表、税制改正、季節要因 — こういう出来事が起きた瞬間に、
#  生活者はAIに聞き方を変える。
#
#  ここには2種類を書く:
#    calendar : 日付が分かっているイベント（発表会・税制施行・季節）
#    watch    : 日付は読めないが、起きたら必ず質問が増えるテーマ（炎上・不祥事型）
#
#  calendar は該当期間に入ると自動でシードに追加され、
#  watch は急上昇検知（surge）のヒント語として使われる。
# ============================================================

version: 1

# ---- 日付が読めるイベント ----
calendar:
  - id: tax_reform_2027
    label: "自動車関係税制の見直し"
    from: "2026-12-01"
    to:   "2027-04-30"
    kind: policy
    seeds:
      - "自動車税 変わる いつから"
      - "重量税 廃止 影響"
      - "EV 補助金 2027 いくら"
      - "自動車税 増税 買い替え 損"
    note: "税制は「損したくない」動機を直撃するので質問量が跳ねる"

  - id: newmodel_alphard
    label: "新型アルファード関連"
    from: "2026-07-01"
    to:   "2026-10-31"
    kind: newmodel
    seeds:
      - "新型アルファード 納期"
      - "アルファード ヴェルファイア 違い"
      - "アルファード 残価設定 危険"
      - "アルファード 中古 高い なぜ"
    note: "新型が出ると、旧型・競合・類似クラスの比較質問が同時に増える"

  - id: newmodel_competitor
    label: "競合の新型発表（ホンダ・日産）"
    from: "2026-08-01"
    to:   "2026-11-30"
    kind: newmodel
    seeds:
      - "新型ステップワゴン アルファード 比較"
      - "セレナ ノア どっち"
      - "新型 ミニバン 2026 比較"
    note: "競合の発表は自社クエリを食う。発表直後2週間の順位を必ず見る"

  - id: winter_season
    label: "冬季（雪道・スタッドレス・帰省）"
    from: "2026-11-01"
    to:   "2027-02-28"
    kind: season
    seeds:
      - "雪道 強い車 4WD"
      - "スタッドレス 必要 地域"
      - "帰省 長距離 疲れない車"
      - "寒冷地仕様 必要か"

  - id: spring_season
    label: "春（新生活・免許取得・卒入学）"
    from: "2027-02-01"
    to:   "2027-04-30"
    kind: season
    seeds:
      - "初めての車 新社会人"
      - "運転初心者 おすすめ 車"
      - "学生 車 維持費"

# ---- 日付は読めないが、起きたら必ず質問が増えるテーマ ----
#  急上昇検知でこれらの語を含むクエリを拾ったら、優先的にコア枠へ入れる。
watch:
  - id: loan_risk
    label: "残クレ・ローンの不安"
    keywords: ["残クレ", "残価設定", "ローン 払えな", "リセール 暴落", "オーバーローン"]
    note: "SNS発の不安が一気に検索とAI質問に流れ込む典型パターン"
  - id: resale_crash
    label: "リセール暴落・転売"
    keywords: ["転売", "リセール 下落", "買取 安くなった", "相場 崩れ"]
  - id: quality_issue
    label: "品質・リコール・不正"
    keywords: ["リコール", "不正", "認証", "型式指定", "出荷停止", "無償修理"]
    note: "自社発の場合は最優先。回答に何が引用されているかを毎日見る"
  - id: leadtime
    label: "納期・受注停止"
    keywords: ["納期", "受注停止", "生産停止", "半導体", "待ち"]
  - id: ev_backlash
    label: "EVへの逆風・後悔"
    keywords: ["EV 後悔", "EV 売れない", "充電 困る", "バッテリー 劣化", "電池 交換 費用"]
  - id: price_hike
    label: "値上げ・価格改定"
    keywords: ["値上げ", "価格改定", "高くなった", "値引き しない"]
