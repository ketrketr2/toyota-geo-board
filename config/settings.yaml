# ============================================================
#  GEO Board 設定
#  すべての閾値・重みはここで管理する。コードは触らない。
# ============================================================

site:
  title: "TOYOTA AI Visibility Board"
  brand: "TOYOTA"
  owner: "s/ash"
  target_domain: "toyota.jp"
  market: "Japan"
  language: "ja"
  timezone: "Asia/Tokyo"

# ---- 実行するAIサーフェス ----
# enabled: false のものはコレクタがスキップする
surfaces:
  - id: chatgpt
    label: "ChatGPT"
    provider: dataforseo          # dataforseo | openai | perplexity | serp
    model: "gpt-5"
    enabled: true
    runs: 1
    weekdays: [1, 4]              # JSTの月・木のみ。会話型は単価が高いので週2回
    system_message: "最新の情報をウェブで確認したうえで、参照した出典を必ず示して日本語で回答してください。"
    # gpt-5 は推論モデルで、推論トークンもこの枠を食う。1500だと推論だけで
    # 使い切って本文が数十文字しか返らない（実測: 本文27文字）。上限まで取る。
    max_tokens: 4096
    weight: 0.244                 # 日本語ブランドメンションの実測構成比
  - id: aio
    label: "AIによる概要"
    provider: serp                # Google SERP の ai_overview 要素
    enabled: true
    runs: 1                       # SERPは同日内でほぼ動かない。3回投げても同じものに払うだけ
    weight: 0.317
  - id: aimode
    label: "AIモード"
    provider: serp
    enabled: true
    runs: 1
    weight: 0.194
  - id: gemini
    label: "Gemini"
    provider: dataforseo
    model: "gemini-2.5-flash"   # DataForSEOが受け付ける実在の名前。gemini-3-proは無い
    enabled: true
    runs: 1
    weekdays: [1, 4]
    weight: 0.245
  - id: perplexity
    label: "Perplexity"
    provider: perplexity
    model: "sonar"
    enabled: false                # 予算に応じて有効化
    weight: 0.0

# ---- サンプリング設計 ----
# LLMは非決定的。1発の値は信用しない。
# 1日あたりの支払上限。実測単価が想定より高かったため、暴走を止める歯止めを置く。
# 超えた時点で新しい呼び出しをやめる（払ってしまった分は戻らないため事前に止める）。
# 疎通確認のときだけ、ChatGPT面を別モデルでも投げて単価と中身を比べる。
# 本番実行では使わない。
compare_models:
  - "gpt-5-mini"

budget:
  daily_usd_max: 8.0

sampling:
  runs_per_prompt: 3              # 既定値。面ごとに surfaces[].runs で上書きできる
  tier_schedule:
    core:        { frequency: daily,   max_prompts: 60,   runs: 3 }
    strategic:   { frequency: weekly,  max_prompts: 200,  runs: 2 }
    longtail:    { frequency: monthly, max_prompts: 3000, runs: 1 }

# ---- スコア重み（合計100）----
# SNS(アーンド引用)を独立因数に格上げした6因数モデル
# ---- ティア判定の閾値 ----
# 6因数を同じ 85/70/55/40 で切っていたが、因数ごとに現実的な上限が違うため
# 意味のある判定になっていなかった（オウンド引用率は11日間ずっとD、出現率はずっとA）。
# 「その因数として何点なら優秀か」を因数ごとに置く。
# 実測レンジは11日間の観測値。運用が進んだら見直す。
tiers:
  presence:        [90, 75, 58, 40]   # 実測 76-85。AIが候補として挙げるか
  rank_quality:    [88, 72, 52, 32]   # 実測 80-87。100=常に1位, 50=常に2位
  owned_citation:  [45, 30, 18, 10]   # 実測 17-33。AIは1回答で5-9件しか引かない
  earned_citation: [78, 62, 46, 30]   # 実測 56-74
  sentiment:       [88, 74, 60, 45]   # 意見が示されたときの肯定率。実測 74-84
  share_of_voice:  [85, 70, 55, 40]   # 均等配分の2.1倍で満点。実測 78-93
  _default:        [85, 70, 55, 40]

score_weights:
  presence:         25    # 出現率
  rank_quality:     15    # 順位品質
  owned_citation:   20    # オウンド引用率
  earned_citation:  20    # アーンド引用率（SNS/UGC）★
  sentiment:        10    # センチメント
  share_of_voice:   10    # 相対シェア

# ---- 差分・有意判定 ----
diff:
  smoothing_window: 7       # 表示用の移動中央値の窓
  significance_sigma: 2.0   # ±2σ以内は「変化なし」
  baseline_days: 30         # σの算出期間
  compare:
    dod: 1
    wow: 7
    mom: 28

# ---- アラート ----
alerts:
  rank_drop_threshold: 3          # 3位以上落ちたら通知
  citation_loss_threshold: 2      # 引用が2件以上消えたら通知
  new_negative_driver: true       # 新規ネガ要因の検出
  slack_webhook_env: SLACK_WEBHOOK_URL
