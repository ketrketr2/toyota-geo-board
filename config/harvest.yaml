# ============================================================
#  クエリ収穫（harvest）と昇降格の設定
#
#  思想:
#   ・クエリは固定しない。市場で実際に聞かれているものへ寄せ続ける。
#   ・ただし ID は絶対に振り直さない。追加と status 変更だけで運用する。
#   ・入替は「上限つき」。一気に入れ替えるとスコアの時系列が壊れるため。
# ============================================================

version: 1

# ---- 収穫の種（この語を起点にサジェスト／PAA／知恵袋を掘る）----
seeds:
  - "ミニバン おすすめ"
  - "SUV おすすめ 国産"
  - "ファミリーカー 選び方"
  - "ハイブリッド 燃費 実燃費"
  - "電気自動車 後悔"
  - "軽自動車 おすすめ"
  - "コンパクトカー 街乗り"
  - "自動ブレーキ 性能 比較"
  - "運転支援 高速道路 疲れない"
  - "リセールバリュー 高い車"
  - "維持費 安い車"
  - "車 納期 長い"
  - "残価設定ローン 損"
  - "カーリース サブスク 比較"
  - "車中泊 できる車"
  - "雪道 強い車"
  - "高齢者 運転しやすい車"
  - "初めての車 新社会人"
  - "中古車 買うなら"
  - "車検 費用 安く"

# ---- 収穫経路と、需要スコアへの寄与 ----
sources:
  suggest:                       # Google サジェスト（無料・公式endpoint）
    enabled: true
    label: "Googleサジェスト"
    per_seed: 10
  paa:                           # 検索結果の「他の人はこちらも質問」
    enabled: true
    label: "Google「関連する質問」"
    per_seed: 8
  chiebukuro:                    # Yahoo!知恵袋の実質問（SERP経由で取得）
    enabled: true
    label: "Yahoo!知恵袋の実質問"
    per_seed: 6
  fanout:                        # AIが内部で投げた派生クエリの回収
    enabled: true
    label: "LLM fan-out還流"
    lookback_days: 30
    min_hits: 2                  # 30日で2回以上現れたものだけ候補にする

# ---- 需要スコア（0〜100）の配点 ----
#  volume : 月間検索ボリューム（対数正規化）
#  fanout : AIが自発的に派生させた回数 = AIにとっての話題の中心性
#  growth : 直近ボリューム ÷ 過去平均（伸びているか）
#  ugc    : 知恵袋など生活者が実際に書いた質問の量
demand_weights:
  volume: 45
  fanout: 25
  growth: 20
  ugc: 10

# ---- コア枠（日次実行）の新陳代謝ルール ----
promotion:
  core_target: 60                # コア枠の目標本数
  core_max: 80                   # 上限（コストと実行時間の歯止め）
  max_promote_per_run: 6         # 1回の収穫で昇格させる上限（空き枠を埋める分）
  max_demote_per_run: 4          # 1回の収穫で降格させる上限
  max_swap_per_run: 4            # 定員が埋まっている時の入替上限
  swap_margin: 8                 # 入替に必要な需要スコア差。僅差では動かさない
  min_days_in_core: 28           # 昇格後28日はコアに固定（すぐ落とさない）
  demand_floor: 25               # 需要スコアがこれ未満なら降格候補
  observation_days: 30           # 新規クエリは30日間コホート外（後述）
  protect_drivers:               # この判断軸のクエリは需要が落ちても降格させない
    - safety
    - urban
    - adas
  min_per_category: 4            # 各テーマ最低何本は残すか（偏り防止）

# ---- 急上昇クエリの緊急投入 ----
#  炎上・新型発表・税制改正のように「今週急に聞かれ始めた」ものは、
#  通常の昇格ルール（需要スコア順・28日固定）を待っていると手遅れになる。
#  条件を満たしたものは定員を一時的に超えてでも即日コア枠に入れる。
surge:
  enabled: true
  growth_threshold: 1.6          # 前回計測比でこれ以上伸びたら急上昇
  min_volume: 300                # 伸び率だけの小さい語を拾わないための下限
  watch_bonus: 1.25              # events.yaml の watch 語に該当したら伸び率に係数
  max_per_run: 3                 # 一度に緊急投入する上限
  overflow_allowed: 3            # 定員を超えてよい本数（次回の収穫で解消する）

# ---- ノイズ除去 ----
reject_patterns:                 # この語を含む候補は捨てる
  - "求人"
  - "採用"
  - "年収"
  - "株価"
  - "配当"
  - "リコール 一覧"
  - "無料"
  - "違法"
  - "エロ"
  - "パチンコ"
min_chars: 8                     # 短すぎる候補は質問として成立しない
max_chars: 220

# ---- 名詞句 → 生活者の質問文 への変換テンプレート ----
#  サジェストは名詞の羅列なので、そのままではAIプロンプトにならない。
#  カテゴリごとに聞き方を変えて、実際の会話に近づける。
question_templates:
  purchase:
    - "「{kw}」で検討しています。どのブランドがおすすめですか。理由も教えてください。"
    - "「{kw}」について、失敗しない選び方を教えてください。"
  model:
    - "「{kw}」を検討しています。同じクラスの他社と比べてどうですか。"
    - "「{kw}」の観点で、国産メーカーを比較して教えてください。"
  safety:
    - "「{kw}」という観点で、いちばん安心して乗れる国産ブランドはどこですか。"
    - "「{kw}」はメーカーによってどれくらい差がありますか。"
  cost:
    - "「{kw}」を重視した場合、実際いくらくらいかかりますか。おすすめの車種も教えてください。"
    - "「{kw}」で損をしない方法を教えてください。国産車で具体的にお願いします。"
  eco:
    - "「{kw}」について、カタログ値ではなく実際のところを教えてください。"
    - "「{kw}」について、国産メーカーではどこが有利か教えてください。"
  service:
    - "「{kw}」で困っています。どうするのが一般的ですか。"
    - "「{kw}」はメーカーによって違いがありますか。"
  brand:
    - "「{kw}」について、他社と比べた強みと弱みを教えてください。"
