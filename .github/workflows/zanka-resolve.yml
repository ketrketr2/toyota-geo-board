name: zanka-resolve
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["triggers/zanka-resolve.json"]
permissions:
  contents: write
concurrency:
  group: zanka-resolve
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python src/resolve_gemini.py
      - name: Commit
        if: ${{ always() }}
        run: |
          git config user.name  "geo-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/zanka || true
          git diff --staged --quiet || git commit -m "chore: zanka gemini resolve $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q || true
          git push || true
