name: zanka-flat

# 残価ページの現状把握（フラットなGA分析）と、検索面のAIによる概要（AIO）の現状把握。
#  ① GA4（Windsor）: 365日トレンド・エンゲージメント・新規/リピート・チャネル・地域・時間帯・イベント・次ページ・Search Console
#  ② DataForSEO: 残価語 × desktop/mobile の自然検索（AIO・引用元・PAA）、キーワード候補（SERP item types 付き）
on:
  workflow_dispatch:
    inputs:
      only_sc:
        description: "Search Console だけ取り直す"
        type: boolean
        default: false
      skip_aio:
        description: "AIO/SERP を飛ばす"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["triggers/zanka-flat.json"]

permissions:
  contents: write

concurrency:
  group: zanka-flat
  cancel-in-progress: false

jobs:
  flat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml requests
      - name: Resolve parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ONLY_SC=$(python3 -c "import json;print(str(json.load(open('triggers/zanka-flat.json')).get('only_sc',False)).lower())")
            SKIP_AIO=$(python3 -c "import json;print(str(json.load(open('triggers/zanka-flat.json')).get('skip_aio',False)).lower())")
          else
            ONLY_SC="${{ inputs.only_sc }}"; SKIP_AIO="${{ inputs.skip_aio }}"
          fi
          echo "only_sc=$ONLY_SC" >> $GITHUB_OUTPUT; echo "skip_aio=$SKIP_AIO" >> $GITHUB_OUTPUT
          echo "only_sc=$ONLY_SC skip_aio=$SKIP_AIO"
      - name: GA4 flat (Windsor)
        continue-on-error: true
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: |
          if [ "${{ steps.params.outputs.only_sc }}" = "true" ]; then python src/ga4_zanka.py --sc; else python src/ga4_zanka.py --flat; python src/ga4_zanka.py --sc; fi
      - name: AIO / SERP (API)
        if: ${{ steps.params.outputs.skip_aio != 'true' }}
        continue-on-error: true
        env:
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN || vars.DATAFORSEO_LOGIN || secrets.DATAFORCED_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GEO_BOARD_MODE: ${{ vars.GEO_BOARD_MODE || 'live' }}
        run: python src/zanka_aio.py
      - name: Commit
        if: ${{ always() }}
        run: |
          git config user.name  "geo-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/zanka || true
          git diff --staged --quiet || git commit -m "chore: zanka flat $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q || true
          git push || true
