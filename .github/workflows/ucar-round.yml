name: ucar-round

# 中古車U（トヨタ認定中古車・第三者発信）の事前計測。
#  ① GA4（Windsor.ai）: toyota.jp 内の中古車関連ページ・U-Carからの流れ・サイト全体のAI経由流入
#  ② DataForSEO: 質問84本（重点34・比較用30・トヨタ指名20）× AIO・AIモード・ChatGPT・Gemini、検索数
# メインの daily-geo-board とは分離し、結果は data/ucar/ に置く。
# 発火: 手動（workflow_dispatch）、triggers/ucar-round.json の更新push、
#       または毎朝（triggers/ucar-round.json の daily_until の日までと、round2 の日。それ以外は何もしない）。
on:
  workflow_dispatch:
    inputs:
      cap:
        description: "この1回の支払上限（USD）"
        default: "30"
      runs:
        description: "4つのAIそれぞれに、1本あたり何回投げるか"
        default: "3"
      skip_llm:
        description: "ChatGPT・Gemini を飛ばす（AIO・AIモード・検索数・GA4だけ）"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["triggers/ucar-round.json"]
  schedule:
    - cron: "40 21 * * *"   # 毎日 06:40 JST

permissions:
  contents: write

concurrency:
  group: geo-board
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Resolve parameters
        id: params
        run: |
          T=triggers/ucar-round.json
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CAP="${{ inputs.cap }}"; RUNS="${{ inputs.runs }}"
            SKIP="${{ inputs.skip_llm == true && '--no-llm' || '' }}"; GO=1
          else
            CAP=$(python3 -c "import json;print(json.load(open('$T')).get('cap','30'))")
            RUNS=$(python3 -c "import json;print(json.load(open('$T')).get('runs','3'))")
            SKIP=$(python3 -c "import json;print('--no-llm' if json.load(open('$T')).get('skip_llm',False) else '')")
            GO=1
            if [ "${{ github.event_name }}" = "schedule" ]; then
              # daily_until の日までは毎朝1回（日ごとのぶれ）。round2 の日は runs 回（事前計測2回目）
              GO=$(python3 -c "import json,datetime as d;j=json.load(open('$T'));t=(d.datetime.utcnow()+d.timedelta(hours=9)).date().isoformat();u=j.get('daily_until','');print(1 if (u and t<=u) or t==j.get('round2','') else 0)")
              RUNS=$(python3 -c "import json,datetime as d;j=json.load(open('$T'));t=(d.datetime.utcnow()+d.timedelta(hours=9)).date().isoformat();print(j.get('runs','3') if t==j.get('round2','') else j.get('daily_runs','1'))")
            fi
          fi
          echo "cap=$CAP" >> $GITHUB_OUTPUT; echo "runs=$RUNS" >> $GITHUB_OUTPUT
          echo "skip=$SKIP" >> $GITHUB_OUTPUT; echo "go=$GO" >> $GITHUB_OUTPUT
          echo "cap=$CAP runs=$RUNS skip=$SKIP go=$GO"

      - name: GA4 (Windsor) for used-car pages
        if: ${{ steps.params.outputs.go == '1' }}
        continue-on-error: true
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python src/ga4_ucar.py

      - name: Commit GA4 results early
        if: ${{ always() && steps.params.outputs.go == '1' }}
        run: |
          git config user.name  "geo-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/ucar || true
          git diff --staged --quiet || git commit -m "chore: ucar ga4 $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q || true
          git push || true

      - name: AI surfaces + SERP + volumes (DataForSEO)
        if: ${{ steps.params.outputs.go == '1' }}
        env:
          GEO_BOARD_MODE:      ${{ vars.GEO_BOARD_MODE || 'demo' }}
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN || vars.DATAFORSEO_LOGIN || secrets.DATAFORCED_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          python src/run_ucar.py --cap "${{ steps.params.outputs.cap }}" --runs "${{ steps.params.outputs.runs }}" ${{ steps.params.outputs.skip }}

      - name: Commit results
        if: ${{ always() && steps.params.outputs.go == '1' }}
        run: |
          git config user.name  "geo-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/ucar || true
          git diff --staged --quiet || git commit -m "chore: ucar round $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do
            git pull --rebase -q && git push && break
            sleep 5
          done
