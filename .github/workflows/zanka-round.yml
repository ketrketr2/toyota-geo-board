name: zanka-round

# 残価設定型プラン（残クレ）専用の臨時計測。
#  ① GA4（Windsor.ai）: 残価関連ページのセッション・参照元・ランディング・イベント
#  ② DataForSEO: 残価関連プロンプト（レジストリ86本＋追加14本）× 全AI面、残価検索語の自然検索
# メインの daily-geo-board とは分離し、結果は data/zanka/ に置く。
# 発火: 手動（workflow_dispatch）または triggers/zanka-round.json の更新push。
on:
  workflow_dispatch:
    inputs:
      cap:
        description: "この1回の支払上限（USD）"
        default: "40"
      skip_llm:
        description: "AI面の計測を飛ばす（GA4だけ取り直す）"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["triggers/zanka-round.json"]

permissions:
  contents: write

concurrency:
  group: geo-board
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Resolve parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CAP=$(python3 -c "import json;print(json.load(open('triggers/zanka-round.json')).get('cap','40'))")
            SKIP=$(python3 -c "import json;print('--no-llm' if json.load(open('triggers/zanka-round.json')).get('skip_llm',False) else '')")
          else
            CAP="${{ inputs.cap }}"
            SKIP="${{ inputs.skip_llm == true && '--no-llm' || '' }}"
          fi
          echo "cap=$CAP" >> $GITHUB_OUTPUT; echo "skip=$SKIP" >> $GITHUB_OUTPUT
          echo "cap=$CAP skip=$SKIP"

      - name: GA4 (Windsor) for zanka pages
        continue-on-error: true
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python src/ga4_zanka.py

      - name: Commit GA4 results early
        if: ${{ always() }}
        run: |
          git config user.name  "geo-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/zanka || true
          git diff --staged --quiet || git commit -m "chore: zanka ga4 $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q || true
          git push || true

      - name: AI surfaces + SERP (DataForSEO)
        env:
          GEO_BOARD_MODE:      ${{ vars.GEO_BOARD_MODE || 'demo' }}
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN || vars.DATAFORSEO_LOGIN || secrets.DATAFORCED_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          python src/run_zanka.py --cap "${{ steps.params.outputs.cap }}" ${{ steps.params.outputs.skip }}

      - name: Commit results
        if: ${{ always() }}
        run: |
          git config user.name  "geo-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/zanka || true
          git diff --staged --quiet || git commit -m "chore: zanka round $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q || true
          git push || true
