name: daily-geo-board

# 毎日 07:17 JST（= 22:17 UTC 前日）。
# GitHub公式が「毎時0分付近は遅延・ドロップされ得る」と明記しているため、
# 意図的に 0分・30分を外している。
on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:          # 手動実行も可能にしておく

permissions:
  contents: write             # スナップショットのコミットに必要
  pages: write
  id-token: write

concurrency:
  group: geo-board
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect & build
        env:
          # ---- 鍵が無ければ自動で demo モードで走る ----
          GEO_BOARD_MODE:      ${{ vars.GEO_BOARD_MODE || 'demo' }}
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GA4_PROPERTY_ID:     ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          YOUTUBE_API_KEY:     ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID:  ${{ secrets.YOUTUBE_CHANNEL_ID }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp.json" >> $GITHUB_ENV
          fi
          python src/run_daily.py

      - name: Notify Slack
        if: ${{ success() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python src/notify.py

      - name: Commit snapshot
        run: |
          git config user.name  "geo-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots docs/data
          git diff --staged --quiet || git commit -m "chore: snapshot $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
