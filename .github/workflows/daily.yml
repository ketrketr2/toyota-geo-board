name: daily-geo-board

# 毎日 07:17 JST（= 22:17 UTC 前日）。
# GitHub公式が「毎時0分付近は遅延・ドロップされ得る」と明記しているため、
# 意図的に 0分・30分を外している。
on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:          # 手動実行も可能にしておく
    inputs:
      harvest:
        description: "クエリ収穫（コア枠の入れ替え）も実行する"
        type: boolean
        default: false
      probe:
        description: "疎通確認だけ行う（数円。本番実行はしない）"
        type: boolean
        default: false
  push:                       # ソースを更新したら即座に再ビルド＆再デプロイ
    branches: [main]
    paths:                    # bot が書き戻すファイルは除外（無限ループ防止）
      - "docs/index.html"
      - "src/**"
      - "config/**"
      - "prompts/**"
      - "!prompts/registry.yaml"   # ← 収穫botが毎週書き換えるので対象外
      - ".github/workflows/**"

permissions:
  contents: write             # スナップショットのコミットに必要
  pages: write
  id-token: write

concurrency:
  group: geo-board
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # 本番を回す前の疎通確認。認証・エンドポイント・モデル名を数円で検証する。
      - name: Probe (live smoke test)
        if: ${{ inputs.probe }}
        env:
          # 疎通確認は変数の状態に関係なく live で走らせる。
          # 「本番に切り替える前に確かめる」ためのものなので、demo のままでは意味がない。
          GEO_BOARD_MODE:      live
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN || vars.DATAFORSEO_LOGIN || secrets.DATAFORCED_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python src/run_daily.py --probe

      # クエリ一覧そのものを市場に合わせて更新する。
      # 毎日やるとコア枠が落ち着かないので、JST月曜（UTC日曜22:17）だけ回す。
      - name: Harvest queries (weekly)
        if: ${{ !inputs.probe }}
        env:
          GEO_BOARD_MODE:      ${{ vars.GEO_BOARD_MODE || 'demo' }}
          # login はメールアドレスであって機密ではないため、変数でも渡せるようにしてある。
          # 3つ目の DATAFORCED_LOGIN は登録時の打ち間違い（DATAFORSEO の綴り違い）で、
          # 中身は正しいので暫定的に拾っている。正しい名前で登録し直したら消してよい。
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN || vars.DATAFORSEO_LOGIN || secrets.DATAFORCED_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          if [ "${{ inputs.harvest }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            python src/harvest.py
          else
            echo "本日は収穫日ではありません（JST月曜のみ実行）"
          fi

      - name: Collect & build
        if: ${{ !inputs.probe }}
        env:
          # ---- 鍵が無ければ自動で demo モードで走る ----
          GEO_BOARD_MODE:      ${{ vars.GEO_BOARD_MODE || 'demo' }}
          # login はメールアドレスであって機密ではないため、変数でも渡せるようにしてある。
          # 3つ目の DATAFORCED_LOGIN は登録時の打ち間違い（DATAFORSEO の綴り違い）で、
          # 中身は正しいので暫定的に拾っている。正しい名前で登録し直したら消してよい。
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN || vars.DATAFORSEO_LOGIN || secrets.DATAFORCED_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GA4_PROPERTY_ID:     ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          YOUTUBE_API_KEY:     ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID:  ${{ secrets.YOUTUBE_CHANNEL_ID }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp.json" >> $GITHUB_ENV
          fi
          python src/run_daily.py

      - name: Notify Slack
        if: ${{ success() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python src/notify.py

      # 失敗しても理由だけは必ず残す。無人実行ではログを後から読めないため。
      - name: Commit error log
        if: ${{ failure() }}
        run: |
          git config user.name  "geo-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/last_error.txt || true
          git diff --staged --quiet || git commit -m "chore: 実行失敗のログ $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q || true
          git push || true

      - name: Commit snapshot
        if: ${{ !inputs.probe }}
        run: |
          git config user.name  "geo-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots data/fanout data/harvest_log.json prompts/registry.yaml
          git diff --staged --quiet || git commit -m "chore: snapshot $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
