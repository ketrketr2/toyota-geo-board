name: ucar-wide

# 中古車U：広く測る回（UCAR SIGNAL の1,761本など、84問とは別の問の束）。
#  ・質問ファイルと結果の置き場所を triggers/ucar-wide.json で指定する（84問の data/ucar には書かない）
#  ・4つのAI（AIO・AIモード・ChatGPT・Gemini）に --runs 回ずつ。llm: false の問は AIO・AIモードだけ
# 発火: triggers/ucar-wide.json の更新push、または手動。毎日の自動実行はしない。
on:
  workflow_dispatch:
    inputs:
      prompts:
        description: "質問のファイル"
        default: "config/ucar_signal_prompts.yaml"
      out:
        description: "結果の置き場所（data/ の下）"
        default: "ucar_signal"
      runs:
        description: "1問あたりの回数"
        default: "1"
      cap:
        description: "この1回の支払上限（USD）"
        default: "70"
  push:
    branches: [main]
    paths: ["triggers/ucar-wide.json"]

permissions:
  contents: write

concurrency:
  group: ucar-wide
  cancel-in-progress: false

jobs:
  wide:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub の上限は6時間
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Resolve parameters
        id: params
        run: |
          T=triggers/ucar-wide.json
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROMPTS="${{ inputs.prompts }}"; OUTD="${{ inputs.out }}"; RUNS="${{ inputs.runs }}"; CAP="${{ inputs.cap }}"; SURF=""
          else
            PROMPTS=$(python3 -c "import json;print(json.load(open('$T')).get('prompts','config/ucar_signal_prompts.yaml'))")
            OUTD=$(python3 -c "import json;print(json.load(open('$T')).get('out','ucar_signal'))")
            RUNS=$(python3 -c "import json;print(json.load(open('$T')).get('runs','1'))")
            CAP=$(python3 -c "import json;print(json.load(open('$T')).get('cap','70'))")
            SURF=$(python3 -c "import json;print(json.load(open('$T')).get('surfaces',''))")
          fi
          EXTRA=""; [ -n "${SURF:-}" ] && EXTRA="--surfaces $SURF"
          echo "prompts=$PROMPTS" >> $GITHUB_OUTPUT; echo "out=$OUTD" >> $GITHUB_OUTPUT
          echo "runs=$RUNS" >> $GITHUB_OUTPUT; echo "cap=$CAP" >> $GITHUB_OUTPUT; echo "extra=$EXTRA" >> $GITHUB_OUTPUT
          echo "prompts=$PROMPTS out=$OUTD runs=$RUNS cap=$CAP extra=$EXTRA"

      - name: AI surfaces + SERP + volumes (DataForSEO)
        timeout-minutes: 330   # 止まっても下の Commit を走らせて、途中まで取れた分を残す（ジョブは混ぜてあるので偏らない）
        env:
          GEO_BOARD_MODE:      ${{ vars.GEO_BOARD_MODE || 'demo' }}
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN || vars.DATAFORSEO_LOGIN || secrets.DATAFORCED_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          UCAR_WORKERS: "28"   # DataForSEO の同時実行の上限（30）に収める（＋Gemini 2）
          UCAR_GEMINI_WORKERS: "2"
        run: |
          python src/run_ucar.py --checkpoint 400 --shuffle --prompts "${{ steps.params.outputs.prompts }}" --out "${{ steps.params.outputs.out }}" --runs "${{ steps.params.outputs.runs }}" --cap "${{ steps.params.outputs.cap }}" ${{ steps.params.outputs.extra }}

      - name: Commit results
        if: ${{ always() }}
        run: |
          git config user.name  "geo-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f "data/${{ steps.params.outputs.out }}" || true
          git diff --staged --quiet || git commit -m "chore: ucar wide ${{ steps.params.outputs.out }} $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do
            git pull --rebase -q && git push && break
            sleep 5
          done
