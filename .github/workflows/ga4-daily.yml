name: ga4-daily

# toyota.jp の GA4 実測（Windsor.ai経由）を毎朝取得し、データマン用の日本語資料 data/ga4/toyota_jp_ga4.md を更新する。
# 鍵はGitHub Secrets（WINDSOR_API_KEY）にだけ置く。Mac側のデータマンはこのリポジトリを pull して資料に取り込む。
on:
  schedule:
    - cron: "40 21 * * *"    # 06:40 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["triggers/ga4-daily.json"]

permissions:
  contents: write

concurrency:
  group: ga4-daily
  cancel-in-progress: false

jobs:
  ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch GA4 via Windsor and build report
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python src/ga4_report.py
      - name: Commit
        run: |
          git config user.name  "geo-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/ga4 || true
          git diff --staged --quiet || git commit -m "chore: ga4 daily $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q || true
          git push || true
