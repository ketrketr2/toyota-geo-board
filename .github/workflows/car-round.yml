name: car-round

# ①車種別AI分析（tier=car）／②ディーラーAI分析（tier=local）の計測。
# メインの daily-geo-board とは完全に分離。
# 発火: 手動（workflow_dispatch）または triggers/car-round.json の更新push（Mac側のデータマンから実行するため）。
on:
  workflow_dispatch:
    inputs:
      tiers:
        description: "回す枠（car / local / car,local）"
        default: "car,local"
      all_surfaces:
        description: "曜日ルールを無視して有効な全面に投げる（テスト1周用）"
        type: boolean
        default: true
      cap:
        description: "この1回の支払上限（USD）"
        default: "60"
  push:
    branches: [main]
    paths: ["triggers/car-round.json"]

permissions:
  contents: write

concurrency:
  group: geo-board          # daily と同グループにして、同時実行での二重支払いを防ぐ
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Resolve parameters (dispatch inputs or triggers/car-round.json)
        id: params
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TIERS=$(python3 -c "import json;print(json.load(open('triggers/car-round.json')).get('tiers','local'))")
            CAP=$(python3 -c "import json;print(json.load(open('triggers/car-round.json')).get('cap','30'))")
            ALL=$(python3 -c "import json;print('--all-surfaces' if json.load(open('triggers/car-round.json')).get('all_surfaces',True) else '')")
          else
            TIERS="${{ inputs.tiers }}"; CAP="${{ inputs.cap }}"
            ALL="${{ inputs.all_surfaces == true && '--all-surfaces' || '' }}"
          fi
          echo "tiers=$TIERS" >> $GITHUB_OUTPUT; echo "cap=$CAP" >> $GITHUB_OUTPUT; echo "all=$ALL" >> $GITHUB_OUTPUT
          echo "tiers=$TIERS cap=$CAP all=$ALL"

      - name: Run car round
        env:
          GEO_BOARD_MODE:      ${{ vars.GEO_BOARD_MODE || 'demo' }}
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN || vars.DATAFORSEO_LOGIN || secrets.DATAFORCED_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          python src/run_car.py \
            --tiers "${{ steps.params.outputs.tiers }}" \
            ${{ steps.params.outputs.all }} \
            --cap "${{ steps.params.outputs.cap }}"

      - name: Commit results
        if: ${{ always() }}
        run: |
          git config user.name  "geo-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/car || true
          git diff --staged --quiet || git commit -m "chore: car round $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q || true
          git push || true
