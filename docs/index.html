<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOYOTA AI Visibility Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-460px 0}100%{background-position:460px 0}}
@keyframes ringIn{from{stroke-dashoffset:308}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:.9}}
@keyframes skel{0%{background-position:-520px 0}100%{background-position:520px 0}}
/* ばね。行き過ぎてから戻るぶん、指で押した感じに近くなる */
.card,.fac,.vs{transition:transform .34s cubic-bezier(.34,1.56,.64,1),
  box-shadow .28s ease,border-color .28s ease}
.card:hover,.fac:hover{transform:translateY(-2px) scale(1.006);
  border-color:color-mix(in srgb,var(--accent) 34%,var(--line));
  box-shadow:0 10px 34px rgba(0,0,0,.34),0 0 0 1px color-mix(in srgb,var(--accent) 16%,transparent)}
@media (prefers-reduced-motion:reduce){
  .card,.fac,.vs{transition:none}
  .card:hover,.fac:hover{transform:none}
}
/* 読み込み中の骨組み。白いちらつきが出ると「壊れた」と読まれる */
.skel{border-radius:10px;background:linear-gradient(90deg,
  color-mix(in srgb,var(--tx) 4%,transparent) 8%,
  color-mix(in srgb,var(--tx) 9%,transparent) 18%,
  color-mix(in srgb,var(--tx) 4%,transparent) 33%);
  background-size:1040px 100%;animation:skel 1.25s linear infinite}
.skelwrap{padding:22px 26px;display:grid;gap:14px}
/* 引用の内訳（スコープ） */
.scopecard{padding:15px 17px}
.scopehd{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.scopettl{font-size:13px;font-weight:700;color:var(--tx)}
.scopenote{font-size:11px;color:var(--sub);margin-top:2px}
.scopelock{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--sub);
  background:color-mix(in srgb,var(--tx) 5%,transparent);border:1px solid var(--line);
  border-radius:8px;padding:5px 10px;white-space:nowrap;cursor:help}
.scopelock b{color:var(--accent2)}
.scopelock .lk{filter:grayscale(1);opacity:.7}
.scoperows{display:grid;gap:7px}
.srow{display:grid;grid-template-columns:170px 1fr 72px;align-items:center;gap:11px;
  padding:6px 8px;border-radius:8px;transition:background .2s}
.srow:hover{background:color-mix(in srgb,var(--tx) 4%,transparent)}
.srow.own{background:color-mix(in srgb,var(--accent2) 8%,transparent)}
.sl{font-size:11.5px;color:var(--tx2);display:flex;align-items:center;gap:6px;min-width:0}
.srow.own .sl{color:var(--tx);font-weight:700}
.sbadge{font-size:9px;padding:1px 6px;border-radius:5px;white-space:nowrap;
  background:color-mix(in srgb,var(--accent2) 20%,transparent);color:var(--accent2)}
.strk{height:9px;border-radius:5px;background:color-mix(in srgb,var(--tx) 8%,transparent);overflow:hidden;min-width:0}
.strk i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#2A6E8F,#38BDF8);
  transition:width .7s cubic-bezier(.22,1,.36,1)}
.srow.own .strk i{background:linear-gradient(90deg,#00A98F,#00E5C7)}
.sv{font-family:"Geist Mono",ui-monospace,monospace;font-size:15px;font-weight:700;
  text-align:right;color:var(--tx2);font-variant-numeric:tabular-nums}
.srow.own .sv{color:var(--accent2)}
.su{font-size:10px;color:var(--sub);margin-left:1px}
.scopewhy{margin-top:11px;font-size:11.5px;color:var(--tx2);line-height:1.75;
  padding-top:10px;border-top:1px solid var(--line)}
@media(max-width:760px){.srow{grid-template-columns:1fr 60px}.strk{display:none}}
/* 蛍光ペン。読み手に必ず拾ってほしい一文だけに使う */
.hl{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--accent2) 42%,transparent) 58%);
  padding:0 2px;font-weight:700;color:var(--tx)}
/* 蛍光ペンの色違い。良い変化は緑、悪い変化は赤で拾わせる */
.hl-g{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--ok) 38%,transparent) 58%);
  padding:0 2px;font-weight:700;color:var(--tx)}
.hl-r{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--bad) 38%,transparent) 58%);
  padding:0 2px;font-weight:700;color:var(--tx)}
.bignum{font-family:"Geist Mono",ui-monospace,monospace;font-size:23px;font-weight:800;
  color:var(--accent2);letter-spacing:-.5px;vertical-align:-1px}
.unit{font-size:11px;color:var(--sub);margin-left:1px}
.muted{color:var(--sub)}
.lead2{color:var(--own);font-weight:700}
.s-lead{font-family:"Geist Mono",monospace;font-weight:700;color:var(--tx)}
.s-sub{color:var(--sub);font-size:11px}
.scatwrap{width:100%;overflow:hidden}
.scat{display:block;max-width:760px;margin:0 auto}
.scat .pt circle{transition:r .2s ease,fill-opacity .2s ease}
.scat .pt:hover circle{fill-opacity:1}
.scatlead{margin-top:10px;font-size:12.5px;line-height:1.75;color:var(--tx2)}
.note2{color:var(--sub);font-size:10px;margin-left:3px;cursor:help}
.hm td.lead{outline:1.5px solid color-mix(in srgb,var(--accent2) 62%,transparent);outline-offset:-2px}
.hm td .rk{display:block;font-size:9px;opacity:.66;line-height:1.2}
.star{cursor:pointer;color:var(--line2);font-size:15px;line-height:1;user-select:none;
  transition:color .18s ease,transform .24s cubic-bezier(.34,1.56,.64,1);display:inline-block}
.star:hover{color:var(--own);transform:scale(1.25)}
.star.on{color:var(--own);text-shadow:0 0 9px color-mix(in srgb,var(--own) 62%,transparent)}
.chip.star b{margin-left:5px;font-family:"Geist Mono",monospace}
.starempty{background:color-mix(in srgb,var(--card2) 66%,transparent);border:1px dashed var(--line2);
  border-radius:10px;padding:11px 14px;margin-bottom:12px;font-size:11.5px;color:var(--tx2);line-height:1.7}
/* ---- 読み方ガイド ---- */
.gtoc{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.gt{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:7px 11px;font-size:11.5px;color:var(--tx2);text-decoration:none;
  transition:border-color .2s,transform .22s cubic-bezier(.34,1.56,.64,1),color .2s}
.gt:hover{border-color:var(--accent);color:var(--tx);transform:translateY(-1px)}
.gt b{font-family:"Geist Mono",monospace;font-size:10.5px;color:var(--accent2);
  background:color-mix(in srgb,var(--accent2) 14%,transparent);border-radius:5px;padding:1px 6px}
.gsec{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:18px 22px;margin-bottom:14px;scroll-margin-top:18px}
.gh{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--tx);margin-bottom:12px}
.gn{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;flex:0 0 25px;
  border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#04121C;font-size:12px;font-weight:800;font-family:"Geist Mono",monospace}
.gb{font-size:12.5px;line-height:1.85;color:var(--tx2)}
.gb p{margin-bottom:10px}
.gb b{color:var(--tx)}
.gul{margin:0 0 10px 2px;padding-left:16px}
.gul li{margin-bottom:6px}
.gul.gng li{list-style:none;position:relative;padding-left:16px}
.gul.gng li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:2px;
  background:var(--amber);opacity:.8}
.gwarn{background:color-mix(in srgb,var(--amber) 10%,transparent);
  border-left:3px solid color-mix(in srgb,var(--amber) 66%,transparent);
  border-radius:0 8px 8px 0;padding:9px 13px;font-size:11.5px}
.gformula{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 12px;
  background:color-mix(in srgb,var(--card2) 74%,transparent);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px}
.gfk{font-size:11px;color:var(--sub);white-space:nowrap}
.gfk b{font-family:"Geist Mono",monospace;font-size:13px;color:var(--tx)}
.gop{color:var(--sub);font-size:12px}
.gfr{font-family:"Geist Mono",monospace;font-size:19px;font-weight:800;color:var(--accent2);margin-left:2px}
.gjump{display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:4px 10px;border-radius:7px;
  background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);
  font-size:11px;cursor:pointer;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  transition:background .2s,transform .2s cubic-bezier(.34,1.56,.64,1)}
.gjump:hover{background:color-mix(in srgb,var(--accent) 24%,transparent);transform:translateX(2px)}
.gfaq{display:grid;gap:7px}
.gq{background:color-mix(in srgb,var(--card2) 70%,transparent);border:1px solid var(--line);
  border-radius:10px;overflow:hidden}
.gq summary{cursor:pointer;padding:10px 14px;font-size:12.5px;font-weight:700;color:var(--tx2);
  list-style:none;display:flex;align-items:center;gap:8px}
.gq summary::-webkit-details-marker{display:none}
.gq summary::before{content:"Q";font-family:"Geist Mono",monospace;font-size:10.5px;color:var(--accent2);
  background:color-mix(in srgb,var(--accent2) 15%,transparent);border-radius:5px;padding:1px 6px;flex:0 0 auto}
.gq[open] summary{color:var(--tx);border-bottom:1px solid var(--line)}
.gq > div{padding:11px 14px 13px 36px;font-size:11.5px;line-height:1.85;color:var(--tx2)}
.gfoot{text-align:center;font-size:11px;color:var(--sub);padding:14px 0 4px}
@media(max-width:760px){
  .gsec{padding:14px 15px}
  .gformula{gap:4px;padding:9px}
  .gfk{font-size:10px}
}
/* ===== ダーク基調（既定）。Linearの黒キャンバス＋OP.GGのゲーム系密度を参照 ===== */
:root{
  --sidebg:#070C13;
  --bg:#080D15; --card:#0E1620; --card2:#121C28;
  --tx:#E9F1FA; --tx2:#BCD2E6; --sub:#7C93AC;
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
  --navy:#0B1F35;--navy2:#12324F;--navy3:#1B4470;--ink:#E9F1FA;
  --accent:#38BDF8;--accent2:#00E5C7;--own:#FFB020;--purple:#A78BFA;
  --warn:#FF6B6B;--ok:#34D399;--amber:#FBBF24;
  --hl:rgba(255,209,0,.28);--hl2:rgba(0,229,199,.22);
  --sh:0 1px 0 rgba(255,255,255,.04) inset,0 8px 26px -14px rgba(0,0,0,.9);
  --sh2:0 1px 0 rgba(255,255,255,.06) inset,0 20px 46px -18px rgba(0,0,0,.95);
  --glow:0 0 0 1px rgba(56,189,248,.18),0 0 26px -6px rgba(0,229,199,.35);
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --grid:rgba(255,255,255,.045);
  --hmtx:#04121E;
}
[data-theme="light"]{
  --sidebg:#0B1F35;
  --bg:#F1F5F9; --card:#FFFFFF; --card2:#F8FAFC;
  --tx:#16202B; --tx2:#12324F; --sub:#64748B; --ink:#16202B;
  --navy:#0B1F35;--navy2:#12324F;--navy3:#1B4470;
  --line:#E2E8F0; --line2:#CBD5E1;
  --accent:#0B6FB4;--accent2:#00A99D;--own:#C98A00;--purple:#7C5CBF;
  --warn:#D64545;--ok:#15926A;--amber:#C98A00;
  --hl:#FFF176;--hl2:#A5F3E0;
  --sh:0 1px 1px rgba(11,31,53,.04),0 2px 6px rgba(11,31,53,.05),0 12px 28px -12px rgba(11,31,53,.10);
  --sh2:0 2px 4px rgba(11,31,53,.06),0 18px 40px -14px rgba(11,31,53,.22);
  --glow:0 0 0 1px rgba(11,111,180,.14),0 0 18px -6px rgba(0,169,157,.3);
  --grid:rgba(11,31,53,.05);
  --hmtx:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
/* 数字は等幅。桁が縦に揃わないと、表もカードも読み取りに余計な負荷がかかる。 */
.fv,.va,.big,.kpi,.sc,td.c,td.n,th.c,.mono,[data-count],.pill,.dn,.up,.hm td,.scat text{
  font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
body{background:
    radial-gradient(900px 520px at 82% -12%,rgba(0,229,199,.10),transparent 60%),
    radial-gradient(760px 420px at 12% 8%,rgba(56,189,248,.08),transparent 60%),
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/44px 44px,
    var(--bg);color:var(--ink);font-family:"Geist","BIZ UDGothic","BIZ UDPGothic","Hiragino Sans",Meiryo,sans-serif;font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:214px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--navy) 0,var(--navy) 214px,var(--bg) 214px)}
/* sidebar */
.side{color:#fff;padding:20px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto;
  background:linear-gradient(180deg,#0B1F35 0%,#0D2843 60%,#0B2136 100%);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.06)}
.side::-webkit-scrollbar{width:0}
.side .brand{padding:0 18px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
.side .lg{display:flex;align-items:center;gap:9px}
.side .dot{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#D8232F,#A4161F);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:0 0 16px -4px rgba(216,35,47,.7)}
.side .nm{letter-spacing:.16em}
.side .sb{letter-spacing:.1em;font-size:9.5px}
.side .nm{font-size:14px;font-weight:700}.side .sb{font-size:10.5px;color:#7E9CB8;letter-spacing:.08em}
.side .grp{font-size:10px;color:#5E7C97;letter-spacing:.14em;padding:14px 18px 6px;font-weight:700}
.side a.nav{display:flex;align-items:center;gap:9px;padding:9px 18px;color:#B9CFE1;font-size:13px;cursor:pointer;
  border-left:3px solid transparent;position:relative;transition:background .22s var(--ease),color .22s,padding-left .22s var(--ease)}
.side a.nav:hover{background:rgba(255,255,255,.06);color:#fff;padding-left:22px}
.side a.nav.on{background:linear-gradient(90deg,rgba(0,169,157,.22),rgba(0,169,157,.05));
  border-left-color:var(--accent2);color:#fff;font-weight:700;
  box-shadow:inset 0 0 24px -8px rgba(0,169,157,.6)}
.side .ic{width:16px;text-align:center;font-size:12px;opacity:.85}
.side .foot{margin-top:20px;padding:14px 18px 0;border-top:1px solid rgba(255,255,255,.1);font-size:10.5px;color:#5E7C97;line-height:1.8}
/* topbar */
.top{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line);padding:13px 26px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(11,31,53,.04)}
.top h1{font-size:17px;font-weight:700;color:var(--tx)}
.top .sep{flex:1}
.fgrp{display:flex;align-items:center;gap:6px}.fgrp .lb{font-size:11px;color:var(--sub)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--card)}
.seg{box-shadow:0 1px 2px rgba(11,31,53,.05)}
.seg button{border:0;background:transparent;padding:5px 13px;font-size:12px;cursor:pointer;color:var(--sub);
  font-family:inherit;border-right:1px solid var(--line);transition:background .2s,color .2s,transform .12s}
.seg button:active{transform:scale(.96)}
.seg button:last-child{border-right:0}
.seg button.on{background:linear-gradient(180deg,#1B4470,#12324F);color:#fff;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:hover:not(.on){background:#F1F5F9}
.stamp{font-size:11px;color:var(--sub)}.stamp b{color:var(--ok)}
.wrap{padding:22px 26px 70px}.page{display:none}.page.on{display:block}
h2.sec{font-size:16px;color:var(--tx);margin:26px 0 12px;display:flex;align-items:center;gap:9px}
h2.sec:first-child{margin-top:0}
h2.sec .bar{width:4px;height:17px;background:var(--accent2);border-radius:2px}
h2.sec .note{font-size:11.5px;color:var(--sub);font-weight:400;margin-left:auto}
h3.sub{font-size:13.5px;color:var(--tx2);margin:16px 0 8px;font-weight:700}
.card{position:relative;background:linear-gradient(180deg,var(--card),var(--card2));
  border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--sh);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:box-shadow .35s var(--ease),transform .35s var(--ease),border-color .35s}
.card::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 38%);opacity:.7}
.card:hover{box-shadow:var(--sh2);border-color:var(--line2);transform:translateY(-2px)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.g23{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:1250px){.g6{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1050px){.g4,.g3,.g23,.g2{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,1fr)}}
/* hero */
.hero{position:relative;overflow:hidden;color:#fff;border-radius:13px;padding:22px 26px;
  background:linear-gradient(135deg,#0A1D31 0%,#12324F 48%,#1B4470 100%);display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;box-shadow:var(--sh)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(520px 240px at 88% -20%,rgba(0,169,157,.30),transparent 60%),
             radial-gradient(420px 200px at 8% 120%,rgba(11,111,180,.28),transparent 60%)}
.hero>*{position:relative;z-index:1}
.hero .ring{position:relative}
.hero .ring svg circle:last-of-type{filter:drop-shadow(0 0 8px rgba(0,169,157,.55));
  transition:stroke-dashoffset 1.1s var(--ease)}
.hero .fac{transition:background .25s,transform .25s var(--ease)}
.hero .fac:hover{background:rgba(255,255,255,.13);transform:translateY(-2px)}
.hero .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero .num b{font-size:33px;line-height:1}.hero .num span{font-size:9.5px;color:#9FC4DE;letter-spacing:.09em}
.hero .num .dv{font-size:11px;font-weight:700;margin-top:2px;max-width:96px;text-align:center;line-height:1.35}
.hero .num .dv .nsg{display:none}
.hero .cmt{font-size:13px;color:#DCEAF6;margin-bottom:10px;line-height:1.75}
.hero .cmt .m{color:#FFE082;font-weight:700}
.hero .facs{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.hero .fac{background:rgba(255,255,255,.07);border-radius:6px;padding:8px 10px}
.hero .fac .fl{font-size:10px;color:#9FC4DE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .fac .fv{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.hero .fac .fw{font-size:9.5px;color:#7E9CB8}
.hero .fac .fd{font-size:10.5px;font-weight:700;white-space:normal;word-break:break-word;line-height:1.45}
/* グリッド子要素の min-width:auto による横あふれを止める */
.main,.wrap,.page,.hero>div,.hero .facs,.hero .fac,.top{min-width:0}
@media(max-width:1460px){.hero .facs{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1050px){.hero{grid-template-columns:1fr}.hero .facs{grid-template-columns:repeat(2,1fr)}}
/* kpi */
.kpi{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:11px;padding:15px 17px;
  box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);
  box-shadow:0 0 18px 1px rgba(11,111,180,.35)}
.kpi::after{content:"";position:absolute;right:-40px;top:-40px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,rgba(11,111,180,.07),transparent 70%);pointer-events:none}
.kpi.own::before{background:var(--own)}.kpi.ok::before{background:var(--ok)}.kpi.warn::before{background:var(--warn)}
.kpi .l{font-size:11.5px;color:var(--sub)}
.kpi .v{font-size:25px;font-weight:700;color:var(--tx);line-height:1.3;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;font-weight:400;color:var(--sub)}
.kpi .d{font-size:11.5px;font-weight:700}
.up{color:var(--ok)}.dn{color:var(--warn)}.fl{color:var(--sub);font-weight:400}
.nsg{color:#94A3B8;font-weight:400}
.par{font-size:11px;font-weight:400;color:var(--sub);white-space:nowrap}
.par.up{color:#2F8F6B}.par.dn{color:#C05555}
.hero .fac .fv .fu{font-size:9.5px;color:#7E9CB8;font-weight:400;margin-left:2px}
.hero .fac .fd .par{color:#9FC4DE;font-size:10px}
.hero .fac .fd .par.up{color:#7FE0B6}.hero .fac .fd .par.dn{color:#F4A3A3}
.hero .num .dv{color:#7E9CB8;font-weight:400;font-size:10px}
.vsub{font-size:11px;color:var(--sub);font-weight:400}
thead th.c{text-align:center}
.builtby{display:inline-flex;align-items:center;gap:6px;background:#EEF6F5;border:1px solid #B9E0DB;color:#0B6157;
  font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap}
.why{background:color-mix(in srgb,var(--accent) 8%,var(--card));border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;
  padding:12px 16px;font-size:12px;color:var(--tx2);line-height:1.85;margin:10px 0}
.why b{color:var(--tx)}
.defs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media(max-width:1050px){.defs{grid-template-columns:1fr}}
.def{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
.def .dt{font-size:11.5px;font-weight:700;color:var(--tx2)}
.def .dd{font-size:11px;color:var(--sub);line-height:1.65}
.def .dw{font-size:10px;color:var(--accent);font-weight:700}
.faq{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
@media(max-width:1050px){.faq{grid-template-columns:1fr}}
.faq .q{background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:11px 14px}
.faq .q .qq{font-size:12px;font-weight:700;color:var(--tx);margin-bottom:3px}
.faq .q .qa{font-size:11.5px;color:var(--tx2);line-height:1.75;opacity:.92}
.qtext{font-size:12.5px;color:var(--tx);line-height:1.65;white-space:normal;word-break:break-word}
.trd{font-size:10.5px;font-weight:700;white-space:nowrap}
.hdlg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin:6px 0 10px}
.hdlg span b{color:var(--tx2)}
/* table */
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{background:var(--card2);color:var(--tx2);font-weight:700;font-size:11.5px;text-align:left;padding:8px 10px;border-bottom:2px solid var(--line2);white-space:nowrap;position:sticky;top:0;z-index:2}
thead th{backdrop-filter:blur(6px)}
thead th.s{cursor:pointer;user-select:none;transition:background .18s,color .18s}
thead th.s:hover{background:#E7F1FA;color:var(--accent)}
tbody td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .16s}
tbody tr:hover{background:linear-gradient(90deg,rgba(56,189,248,.10),transparent)}
tr.qrow td:first-child{transition:transform .25s var(--ease)}
tr.qrow:hover td:first-child{transform:translateX(2px)}
td.n{text-align:right;font-variant-numeric:tabular-nums}td.c{text-align:center}
.tw{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--sh)}
.tw::-webkit-scrollbar{width:9px;height:9px}
.tw::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
.tw::-webkit-scrollbar-thumb:hover{background:#94A3B8}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap}
.p-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.p-ng{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.p-am{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.p-nv{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--tx2)}
.p-pu{background:color-mix(in srgb,var(--purple) 18%,transparent);color:var(--purple)}
.rk{display:inline-flex;width:24px;height:24px;border-radius:7px;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--tx2);border:1px solid var(--line)}
.rk.r1{background:var(--ok);color:#fff}.rk.r2{background:#5CBB8B;color:#fff}.rk.r3{background:#A8D8C0;color:#0B3D2A}
.rk.rx{background:#FDECEC;color:var(--warn)}
.mini{height:6px;background:color-mix(in srgb,var(--tx) 10%,transparent);border-radius:3px;overflow:hidden;min-width:44px}
.mini i{display:block;height:6px;background:var(--accent);border-radius:3px;transition:width .85s var(--ease)}
.mini i.own{background:var(--own)}.mini i.g{background:var(--ok)}
.bars .row{display:grid;grid-template-columns:130px 1fr 92px;gap:9px;align-items:center;margin:6px 0;font-size:12px}
.bars .row .lb{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .row .lb.me{color:var(--own);font-weight:700}
.bars .tr{display:block;height:18px;background:color-mix(in srgb,var(--tx) 8%,transparent);border-radius:3px;overflow:hidden}
.bars .fi{display:block;height:18px;background:linear-gradient(90deg,#0B6FB4,#3FA0DC);border-radius:3px;
  box-shadow:0 1px 6px -1px rgba(11,111,180,.5);transition:width .85s var(--ease)}
.bars .row:hover .fi{filter:brightness(1.08)}
.bars .fi.me{background:linear-gradient(90deg,#B87F00,#E8B004)}
.bars .fi.g{background:linear-gradient(90deg,#15926A,#4CBF8A)}
.bars .va{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.note{border-left:3px solid var(--amber);background:color-mix(in srgb,var(--amber) 10%,var(--card));padding:10px 14px;border-radius:0 5px 5px 0;font-size:12.5px;margin:12px 0}
.note.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.note.ng{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:var(--card);border-radius:16px;
  padding:4px 13px;font-size:11.5px;color:var(--tx2);cursor:pointer;
  transition:all .2s var(--ease);box-shadow:0 1px 2px rgba(11,31,53,.04)}
.chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.chip:active{transform:scale(.96)}
.chip.on{background:linear-gradient(180deg,#1B4470,#12324F);color:#fff;border-color:#12324F;box-shadow:0 3px 10px -3px rgba(18,50,79,.6)}
.tag{display:inline-block;font-size:10px;padding:1.5px 7px;border-radius:5px;background:color-mix(in srgb,var(--accent) 11%,transparent);color:var(--tx2);margin-right:3px;border:1px solid var(--line)}
.hm td.h{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.hm td.h{border-radius:5px;transition:box-shadow .18s var(--ease),transform .18s var(--ease)}
.hm tbody tr:hover td.h{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tx) 22%,transparent)}
.h0{background:transparent;color:var(--sub)!important;opacity:.35}
.h1{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--tx2)!important}
.h2{background:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--tx)!important}
.h3{background:color-mix(in srgb,var(--accent) 44%,transparent);color:var(--tx)!important}
.h4{background:color-mix(in srgb,var(--accent) 64%,transparent);color:var(--hmtx)!important}
.h5{background:color-mix(in srgb,var(--accent) 86%,transparent);color:var(--hmtx)!important}
.src{font-size:10.5px;color:var(--sub);margin-top:8px;line-height:1.65}
a{color:var(--accent);text-decoration:none}
mark{background:linear-gradient(transparent 52%,var(--hl) 52%);font-weight:700;padding:0 2px;border-radius:2px}
mark.r{background:linear-gradient(transparent 52%,color-mix(in srgb,var(--warn) 34%,transparent) 52%)}
code{background:color-mix(in srgb,var(--accent) 12%,transparent);padding:1px 5px;border-radius:3px;font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--tx2)}
.al{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center}
.al:last-child{border-bottom:0}
#loading{padding:60px;text-align:center;color:var(--sub)}
.page.on{animation:fadeUp .38s var(--ease) both}
.rv{opacity:0;transform:translateY(16px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.rv.in{opacity:1;transform:none}
#tip{position:fixed;z-index:999;pointer-events:none;opacity:0;transition:opacity .15s;
  background:rgba(11,31,53,.95);color:#fff;font-size:11.5px;line-height:1.6;padding:7px 11px;border-radius:7px;
  box-shadow:0 8px 24px -6px rgba(0,0,0,.45);white-space:nowrap;backdrop-filter:blur(6px)}
#tip b{color:#7FE7DC}
svg.lchart{cursor:crosshair}
svg.lchart .cursor{opacity:0;transition:opacity .12s}
svg.lchart .hoverdot{opacity:0;transition:opacity .12s}
.skel{background:linear-gradient(90deg,#EEF2F7 25%,#F7FAFC 50%,#EEF2F7 75%);background-size:900px 100%;
  animation:shimmer 1.3s infinite linear;border-radius:8px}
tr.qrow td:first-child{font-size:13px}
.pill{transition:transform .15s var(--ease)}
tr:hover .pill{transform:scale(1.04)}
.crow{transition:border-color .2s,box-shadow .2s,transform .2s var(--ease)}
.crow:hover{border-color:var(--accent);box-shadow:0 4px 14px -6px rgba(11,111,180,.45);transform:translateX(2px)}
.builtby{box-shadow:0 1px 3px rgba(11,97,87,.15)}
h2.sec .bar{box-shadow:0 0 12px var(--accent2);background:linear-gradient(180deg,var(--accent2),var(--accent))}
/* ---- ティアバッジ（ゲームのランク表示） ---- */
.tier{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  width:66px;height:74px;border-radius:12px;font-weight:800;letter-spacing:.02em;
  clip-path:polygon(50% 0,100% 16%,100% 84%,50% 100%,0 84%,0 16%);
  background:linear-gradient(160deg,var(--tc1),var(--tc2));box-shadow:0 0 30px -6px var(--tc1)}
.tier .tg{font-size:29px;line-height:1;color:#08131C;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.tier .tl{font-size:8.5px;letter-spacing:.14em;color:rgba(8,19,28,.72);margin-top:2px}
.tier.s{--tc1:#FFD75E;--tc2:#FF9E2C}.tier.a{--tc1:#7DF5C8;--tc2:#22C58A}
.tier.b{--tc1:#7FD0FF;--tc2:#2E8FE0}.tier.c{--tc1:#C3B5FF;--tc2:#7C5CBF}
.tier.d{--tc1:#FFB3B3;--tc2:#E05252}
/* ---- セグメント式ゲージ ---- */
.gauge{display:flex;gap:2px;height:9px;margin-top:7px}
.gauge i{flex:1;border-radius:2px;background:color-mix(in srgb,var(--tx) 11%,transparent);transition:background .5s var(--ease),box-shadow .5s}
.gauge i.f{background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:0 0 9px -2px var(--accent2)}
/* ---- レーダー ---- */
.radar-wrap{display:grid;grid-template-columns:320px 1fr;gap:26px;align-items:center}
@media(max-width:1100px){.radar-wrap{grid-template-columns:1fr}}
.fbar{margin-bottom:13px}
.fbar .fh{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
.fbar .fh .fn{font-weight:700;color:var(--tx)}
.fbar .fh .fq{margin-left:auto;font-size:17px;font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums}
.fbar .fh .fs{font-size:10px;color:var(--sub)}
.fbar .fm{font-size:10.5px;color:var(--sub);margin-top:5px;display:flex;gap:10px;align-items:center}
.radar{filter:drop-shadow(0 0 16px rgba(0,229,199,.28))}
.radar .rgrid{stroke:var(--line2);fill:none}
.radar .rax{stroke:var(--line);}
.radar .rpoly{fill:color-mix(in srgb,var(--accent2) 26%,transparent);stroke:var(--accent2);stroke-width:2;
  stroke-linejoin:round;transition:all .9s var(--ease)}
.radar .rdot{fill:var(--accent2);stroke:var(--bg);stroke-width:1.5}
.radar text{fill:var(--sub);font-size:8.6px}
.radar .rv{fill:var(--tx);font-size:9.4px;font-weight:700}
/* ---- VSパネル（ゲームのスタッツ対比） ---- */
.vsg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:1100px){.vsg{grid-template-columns:1fr}}
.vs{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
  border-radius:13px;padding:14px 16px;box-shadow:var(--sh);transition:border-color .3s,transform .3s var(--ease)}
.vs:hover{border-color:var(--line2);transform:translateY(-2px)}
.vs .vh{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.vs .vh .n1{font-size:13px;font-weight:800;color:var(--accent2)}
.vs .vh .n2{font-size:13px;font-weight:800;color:var(--tx2);margin-left:auto}
.vs .vh .vd{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--sub);
  border:1px solid var(--line2);border-radius:20px;padding:2px 9px}
.vs .mt{margin:9px 0}
.vs .ml{display:flex;font-size:11.5px;margin-bottom:4px;align-items:baseline}
.vs .ml .lv{font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums}
.vs .ml .lc{margin:0 auto;color:var(--sub);font-size:10.5px}
.vs .bar2{display:flex;height:7px;border-radius:4px;overflow:hidden;background:color-mix(in srgb,var(--tx) 9%,transparent)}
.vs .bar2 i{transition:width .8s var(--ease)}
.vs .win{color:var(--accent2)}.vs .lose{color:var(--warn)}
/* ---- モーダル ---- */
#modal{position:fixed;inset:0;z-index:420;display:none;background:rgba(3,7,12,.66);backdrop-filter:blur(7px)}
#modal.on{display:block;animation:fadeUp .2s var(--ease)}
#modalbox{max-width:900px;margin:8vh auto 0;background:linear-gradient(180deg,var(--card),var(--card2));
  border:1px solid var(--line2);border-radius:18px;box-shadow:0 50px 110px -34px rgba(0,0,0,.92);
  max-height:82vh;overflow:auto;animation:fadeUp .3s var(--spring) both}
#modalhd{position:sticky;top:0;background:inherit;display:flex;align-items:center;gap:12px;
  padding:18px 24px;border-bottom:1px solid var(--line);z-index:2}
#modalhd h3{font-size:16px;color:var(--tx);font-weight:800}
#modalhd .x{margin-left:auto;cursor:pointer;color:var(--sub);font-size:20px;line-height:1;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:all .2s}
#modalhd .x:hover{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
#modalbd{padding:20px 24px 26px}
.hbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:var(--card);
  border-radius:20px;padding:3px 11px;font-size:11px;color:var(--sub);cursor:pointer;transition:all .2s var(--ease)}
.hbtn:hover{color:var(--accent2);border-color:var(--accent2);transform:translateY(-1px)}
.hbtn .qm{display:inline-flex;width:14px;height:14px;border-radius:50%;background:var(--accent2);color:#06131A;
  font-size:10px;font-weight:800;align-items:center;justify-content:center}
/* ---- 説明ブロック：折りたたみ ---- */
.why{cursor:pointer;position:relative;padding:8px 14px}
.why>.wt{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--tx);font-size:12.5px}
.why>.wt .ar{margin-left:auto;color:var(--sub);font-size:9px;transition:transform .3s var(--ease)}
.why>.wt{font-size:11.5px;color:var(--sub);font-weight:600}
.why:hover>.wt{color:var(--accent2)}
.why.op>.wt .ar{transform:rotate(180deg)}
.why>.wb{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s var(--ease),opacity .3s,margin-top .3s}
.why.op>.wb{max-height:420px;opacity:1;margin-top:8px}
/* ---- コマンドパレット ---- */
#pal{position:fixed;inset:0;z-index:400;display:none;background:rgba(3,7,12,.62);backdrop-filter:blur(6px)}
#pal.on{display:block;animation:fadeUp .18s var(--ease)}
#palbox{max-width:620px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line2);border-radius:16px;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9);overflow:hidden}
#palin{width:100%;border:0;outline:0;background:transparent;color:var(--tx);font-size:15px;padding:16px 18px;
  font-family:inherit;border-bottom:1px solid var(--line)}
#pallist{max-height:52vh;overflow:auto;padding:6px}
.pitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--tx2)}
.pitem .pk{font-size:10px;color:var(--sub);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;margin-left:auto}
.pitem.sel,.pitem:hover{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--tx)}
.kbd{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line2);border-radius:5px;padding:2px 6px;
  font-size:10px;color:var(--sub);background:var(--card2);cursor:pointer;transition:all .2s}
.kbd:hover{color:var(--accent2);border-color:var(--accent2)}
/* ---- トースト ---- */
#toast{position:fixed;right:22px;bottom:22px;z-index:500;display:flex;flex-direction:column;gap:8px}
.tst{background:var(--card);border:1px solid var(--line2);border-left:3px solid var(--accent2);border-radius:11px;
  padding:11px 16px;font-size:12.5px;color:var(--tx);box-shadow:0 18px 40px -16px rgba(0,0,0,.85);
  animation:fadeUp .35s var(--spring) both;min-width:230px}
.tst b{color:var(--accent2)}
/* ---- テーマ切替 ---- */
.tgl{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:var(--card);
  border-radius:8px;padding:4px 10px;font-size:11.5px;color:var(--sub);cursor:pointer;transition:all .2s}
.tgl:hover{color:var(--accent2);border-color:var(--accent2)}
/* ---- 線グラフのドロー ---- */
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
svg.lchart polyline.main{stroke-dasharray:var(--len);animation:draw 1.5s var(--ease) both}
svg.lchart polygon{animation:fadeUp .9s .35s var(--ease) both}
/* ---- 見出し・ヘッダー ---- */
.hero{border:1px solid rgba(255,255,255,.09)}
.side .brand .dot{box-shadow:0 0 18px -3px var(--accent2)}
mark{color:inherit}
[data-theme="light"] mark{color:#3A2E00}
.builtby{background:color-mix(in srgb,var(--accent2) 12%,transparent);border-color:color-mix(in srgb,var(--accent2) 40%,transparent);color:var(--accent2)}
.hdlg{padding:9px 12px;background:var(--card2);border:1px solid var(--line);border-radius:10px}
h2.sec .note{background:color-mix(in srgb,var(--amber) 12%,transparent);padding:3px 10px;border-radius:20px;
  border:1px solid color-mix(in srgb,var(--amber) 26%,transparent);color:var(--amber)}
.src{color:var(--sub)}
tr.qrow{cursor:pointer}
tr.qdet td{background:color-mix(in srgb,var(--accent) 5%,var(--card));padding:0}

/* ============ スマホ（760px以下）============
   サイドバーが画面の半分を占めてしまうため、上部の横スクロールタブに変える。
   表は横スクロール、グリッドは全て1列に落とす。 */
@media(max-width:760px){
  body{font-size:13px}
  .app{display:block;background:var(--bg)}
  .side{position:sticky;top:0;height:auto;width:100%;padding:0;overflow-x:auto;overflow-y:hidden;
    display:flex;flex-wrap:nowrap;align-items:stretch;z-index:40;
    box-shadow:0 3px 14px -5px rgba(0,0,0,.65)}
  .side .brand{flex:0 0 auto;padding:9px 12px;margin:0;border-bottom:0;
    border-right:1px solid rgba(255,255,255,.14);display:flex;align-items:center}
  .side .brand .sb{display:none}
  .side .nm{font-size:12px;letter-spacing:.12em}
  .side .dot{width:22px;height:22px}
  .side .grp,.side .foot{display:none}
  .side a.nav{flex:0 0 auto;padding:11px 13px;border-left:0;border-bottom:2px solid transparent;
    white-space:nowrap;font-size:12px;gap:6px}
  .side a.nav:hover{padding-left:13px;background:transparent}
  .side a.nav.on{background:rgba(0,169,157,.16);border-left-color:transparent;
    border-bottom-color:var(--accent2);box-shadow:none}
  .top{position:static;padding:9px 12px;gap:8px}
  .top h1{font-size:15px}
  .top .sep{display:none}
  #palBtn{display:none}                            /* コマンドパレットはPC向けなので隠す */
  .stamp{font-size:10px;margin-left:auto}
  .fgrp .lb{display:none}
  .seg button{padding:5px 10px;font-size:11.5px}
  .wrap{padding:14px 12px 60px}
  /* グリッドは全部1列 */
  .hero{grid-template-columns:1fr;padding:16px 14px;gap:14px}
  .hero .facs{grid-template-columns:repeat(2,1fr)}
  .g2,.g3,.g4,.g23,.vsg,.radar-wrap{grid-template-columns:1fr;gap:12px}
  .g2>*,.g3>*,.g4>*,.g23>*,.g6>*,.vsg>*,.radar-wrap>*{min-width:0}
  .g6{grid-template-columns:repeat(2,1fr)}
  .kpi{padding:12px 14px}
  .kpi .v{font-size:21px}
  h2.sec{font-size:14px;margin:20px 0 10px;flex-wrap:wrap}
  h2.sec .note{margin-left:0;flex:1 0 100%}
  /* 表は横スクロール。潰すと数字が読めなくなるため縮めない。 */
  .tw{max-height:none;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tw table{min-width:680px}
  .hm table{min-width:760px}
  #qt{min-width:900px}
  .hdlg{flex-direction:column;gap:5px}
  .qsearch{flex-wrap:wrap;padding:7px 11px}
  .qsearch input{min-width:0;font-size:16px}      /* iOSの自動ズーム防止 */
  .qsearch .qn{font-size:10px}
  .chips{gap:5px}.chip{padding:4px 10px;font-size:11px}
  /* 明細まわり */
  .mv{grid-template-columns:24px 1fr;row-gap:5px}
  .mv .dm{grid-column:2;text-align:left;font-size:13px}
  .mv .dm small{display:inline;margin-left:5px}
  .crow{grid-template-columns:1fr;gap:5px}
  .csf{white-space:normal}
  .bars .row{grid-template-columns:96px 1fr 68px;gap:6px;font-size:11.5px}
  .bars .row .lb{min-width:0}
  .legend{font-size:10.5px;gap:8px}
  .card{padding:13px 14px}
  .cohortbar{flex-direction:column;height:auto}
  .cohortbar span{padding:6px;font-size:11px}
  .ansbox{max-height:none;font-size:12.5px}
  .detwrap{padding:11px 12px 13px}
  .dq .cu{white-space:normal;word-break:break-all}
  /* オーバーレイ */
  #modalbox{margin:0;max-width:none;min-height:100vh;border-radius:0}
  #modalbd{padding:14px 13px 26px}
  #palbox{margin:6vh 10px 0}
  #toast{left:10px;right:10px;bottom:10px}
  .tst{min-width:0}
  .ring svg{width:104px;height:104px}
}
@media(max-width:420px){
  .hero .facs{grid-template-columns:1fr}
  .g6{grid-template-columns:1fr}
}
/* ---- デモ／実測バッジ ---- */

<script>

const PJ={dod:"前日比",wow:"先週比",mom:"先月比"};
const FDESC={
 presence:["AIの回答に自社の名前が出た割合","55本のプロンプトを4つのAIに投げ、回答文の中に「トヨタ」が登場した割合。低い＝そもそも候補に挙げてもらえていない。"],

 earned_citation:["SNS・UGCが引かれ、そこに自社が載っていた割合","YouTube・知恵袋・note等が根拠として引かれたとき、その回答で自社が言及されていた割合。プラットフォーム重みを掛けて合成。"],
 sentiment:["AIが評価を述べたとき、それが好意的だった割合","自社に触れた文の語調を判定し、<b>肯定 ÷（肯定＋否定）</b>で算出。中立は「評価を述べていない」ので分母から外す。低い＝語られるときに否定的に扱われている。"],
 share_of_voice:["競合を含めた言及総数に占める自社の割合","均等配分の2.1倍を満点として換算。総合的な露出量の指標。"]};
/* クエリの出所。専門語のままだと初見で読めないので、日常語に寄せる。

  suggest:"検索候補",semrush_import:"KW調査",harvest:"自動収集",gsc:"検索実績",'-':"初期設定"};

let D=null, P="dod", sortK="demand", sortDir=-1, catF="all";

/* 用語の意味。初見の人が読めないままにしない。 */
const TERM={
  "AIによる概要":"Google検索の結果ページ上部に出るAIの要約。検索したときに最初に目に入る枠",
  "AIモード":"Googleの検索を対話形式に置き換えたモード。検索窓ではなくAIと会話して答えを得る",
  "ChatGPT":"OpenAIの対話型AI。日本での利用者数が最も多い",

  "需要":"そのクエリが世の中でどれだけ聞かれているかの推定値（0〜100）。月間検索数45＋AIが自分で調べ直した回数25＋伸び率20＋知恵袋での出現10で算出",
  "最良":"4つのAIのうち、自社がいちばん良い順位に置かれたときの順位。1が最良",
  "月間検索":"Googleでそのキーワードが月に検索されるおおよその回数",

};
const tip=(label,extra)=>`title="${attr((TERM[label]||"")+(extra?"\n"+extra:""))}"`;
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const num=v=>v==null?"—":(+v).toLocaleString();
const f1=v=>v==null?"—":(+v).toFixed(1);

function delta(m,p,unit){ // 差分は必ず「（前日比 +0.12pt）」形式の補助表示にする
  unit = unit===undefined ? "pt" : unit;
  const none = {html:'<span class="par">（比較データなし）</span>',v:null};
  if(!m||!m.deltas||!m.deltas[p]) return none;
  const d=m.deltas[p];
  if(d.delta==null) return none;
  const sg=d.significant, s0=d.delta>=0?"+":"";
  const cls = sg===false ? "par nsg" : (d.delta>0?"par up":d.delta<0?"par dn":"par");
  const val = unit==="pt" ? d.delta.toFixed(2) : Math.round(d.delta).toLocaleString();
  const tail = sg===false ? "・誤差の範囲" : "";
  const ti = sg===false ? "日々のばらつき（±2σ）の内側です。実質は横ばいと読んでください" : "日々のばらつき（±2σ）を超える変化です";
  return {html:`<span class="${cls}" title="${ti}">（${PJ[p]} ${s0}${val}${unit}${tail}）</span>`, v:d.delta};
}
/* 見出し。
   実測では総合スコアの前日比が有意になったのは6日中2日だけで、レンジも5.6ptしかない。
   一方でクエリ単位では1日に引用消失20本・獲得2本・順位変動9本が起きている。
   総合スコアの増減より、そちらを先に読ませる。 */
function queryEvents(period){
  const ev={gained:[],lost:[],up:[],down:[]};
  (D.queries||[]).forEach(q=>{
    const tr=(q.trend||{})[period]; if(!tr) return;
    if(tr.cite_change==="gained") ev.gained.push(q);
    if(tr.cite_change==="lost")   ev.lost.push(q);
    if(tr.rank_delta>0) ev.up.push(q);
    if(tr.rank_delta<0) ev.down.push(q);
  });
  return ev;
}
function headline(){
  const m=D.diff?.metrics?.score, d=m?.deltas?.[P];
  const ev=queryEvents(P);
  const moved=ev.gained.length+ev.lost.length+ev.up.length+ev.down.length;
  const t=tierScore(scoreNow());
  let s=`本日のGEOスコアは <b class="bignum">${scoreNow().toFixed(1)}</b><span class="unit">/100</span>（${t.g}ティア）。`;
  if(d&&d.delta!=null){
    const sg=2*(m.sigma||0), sign=d.delta>=0?"+":"";
    s += d.significant===false
      ? `${PJ[P]} ${sign}${d.delta.toFixed(2)}pt は<span class="muted">ばらつき ±${sg.toFixed(2)}pt の内側なので横ばい</span>。`
      : `${PJ[P]} <b class="${d.delta>0?'up':'dn'}">${sign}${d.delta.toFixed(2)}pt</b>。ばらつき ±${sg.toFixed(2)}pt を超えた<b>本物の${d.delta>0?"上昇":"低下"}</b>です。`;
  }
  if(moved){
    const bits=[];
    if(ev.lost.length)   bits.push(`<b class="hl-r">自社ページが引かれなくなったクエリ ${ev.lost.length}本</b>`);
    if(ev.gained.length) bits.push(`<b class="hl-g">新たに引かれ始めた ${ev.gained.length}本</b>`);
    if(ev.down.length)   bits.push(`順位が下がった ${ev.down.length}本`);
    if(ev.up.length)     bits.push(`上がった ${ev.up.length}本`);
    s += `<br><span class="lead2">総合スコアより先に見るべきはこちら：</span>${bits.join(" ／ ")}。`;
  }
  return s;
}

/* ---------- charts ---------- */
function lineChart(hist,keys,colors,h=190,labels){
  if(!hist||!hist.length) return "";
  labels=labels||keys;
  const W=640,pad={l:38,r:12,t:14,b:22};
  const all=keys.flatMap(k=>hist.map(d=>d[k])).filter(v=>v!=null);
  let mn=Math.min(...all),mx=Math.max(...all);
  const pd=(mx-mn)*.15||1; mn=Math.max(0,mn-pd); mx=mx+pd;
  const X=i=>pad.l+i*(W-pad.l-pad.r)/Math.max(hist.length-1,1);
  const Y=v=>pad.t+(1-(v-mn)/(mx-mn))*(h-pad.t-pad.b);
  let g="";
  for(let i=0;i<=4;i++){const y=pad.t+i*(h-pad.t-pad.b)/4;
    g+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--line)"/>`+
       `<text x="6" y="${y+3}" font-size="9" fill="var(--sub)">${(mx-(mx-mn)*i/4).toFixed(0)}</text>`;}
  const gid="g"+Math.abs(keys.join().split("").reduce((a,c)=>a+c.charCodeAt(0),0));
  keys.forEach((k,ki)=>{
    const pts=hist.map((d,i)=>d[k]==null?null:`${X(i)},${Y(d[k])}`).filter(Boolean).join(" ");
    if(ki===0) g+=`<polygon fill="url(#${gid})" points="${pts} ${X(hist.length-1)},${h-pad.b} ${X(0)},${h-pad.b}"/>`;
    const len=Math.round(hist.length*22);
    g+=`<polyline class="${ki?'':'main'}" style="--len:${len}" fill="none" stroke="${colors[ki]}" stroke-width="${ki?1.6:2.6}" stroke-linejoin="round" stroke-linecap="round" ${ki?'stroke-dasharray="4 3"':''} points="${pts}"/>`;
  });
  const last=hist[hist.length-1];
  if(last[keys[0]]!=null)
    g+=`<circle cx="${X(hist.length-1)}" cy="${Y(last[keys[0]])}" r="4.5" fill="${colors[0]}" stroke="#fff" stroke-width="1.6"/>`;
  g+=`<line class="cursor" x1="0" y1="${pad.t}" x2="0" y2="${h-pad.b}" stroke="var(--sub)" stroke-width="1" stroke-dasharray="3 3"/>`;
  g+=`<circle class="hoverdot" r="5" fill="${colors[0]}" stroke="#fff" stroke-width="2"/>`;
  // デモ→実測の切替点。ここより左は合成データなので、同じ線として読ませない。
  const li=hist.findIndex(d=>d.mode==="live");
  if(li>0){
    const bx=X(li)-(X(li)-X(li-1))/2;
    g+=`<rect x="${pad.l}" y="${pad.t}" width="${Math.max(bx-pad.l,0)}" height="${h-pad.t-pad.b}" fill="var(--sub)" opacity=".07"/>`;
    g+=`<line x1="${bx}" y1="${pad.t}" x2="${bx}" y2="${h-pad.b}" stroke="var(--amber)" stroke-width="1.2" stroke-dasharray="4 3" opacity=".85"/>`;
    g+=`<text x="${bx-5}" y="${pad.t+10}" font-size="8.5" fill="var(--sub)" text-anchor="end">← デモ</text>`;
    g+=`<text x="${bx+5}" y="${pad.t+10}" font-size="8.5" fill="var(--amber)">実測 →</text>`;
  }
  g+=`<text x="${pad.l}" y="${h-4}" font-size="9" fill="var(--sub)">${hist[0].date.slice(5)}</text>`+
     `<text x="${W-pad.r-28}" y="${h-4}" font-size="9" fill="var(--sub)">${last.date.slice(5)}</text>`;
  g+=`<rect x="0" y="0" width="${W}" height="${h}" fill="transparent"/>`;
  const meta=hist.map((d,i)=>({x:+X(i).toFixed(1),y:+(d[keys[0]]!=null?Y(d[keys[0]]):0).toFixed(1),
                               d:d.date,vals:keys.map(k=>d[k])}));
  return `<svg class="lchart" viewBox="0 0 ${W} ${h}" style="width:100%;height:auto"
    data-pts='${JSON.stringify(meta).replace(/'/g,"&apos;")}'
    data-labels='${JSON.stringify(labels).replace(/'/g,"&apos;")}'
    data-colors='${JSON.stringify(colors).replace(/'/g,"&apos;")}'>
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${colors[0]}" stop-opacity=".28"/><stop offset="100%" stop-color="${colors[0]}" stop-opacity="0"/>
    </linearGradient></defs>${g}</svg>`;
}
function donut(items,total,label){
  let off=25,g="";
  items.forEach(it=>{const pct=total?it.v/total*100:0;
    g+=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${it.c}" stroke-width="7.5"
        stroke-dasharray="${pct.toFixed(2)} ${(100-pct).toFixed(2)}" stroke-dashoffset="${off}"/>`;
    off-=pct;});
  return `<svg width="140" height="140" viewBox="0 0 42 42">${g}
    <text x="21" y="20.5" text-anchor="middle" font-size="4" font-weight="700" fill="var(--tx)">${num(total)}</text>
    <text x="21" y="24.6" text-anchor="middle" font-size="2.2" fill="var(--sub)">${label}</text></svg>`;
}
const PAL=["#38BDF8","#00E5C7","#A78BFA","#FFB020","#34D399","#7C93AC","#FF6B6B","#FBBF24"];

/* ---- ティア判定（ゲームのランク表示） ---- */
/* ティア判定。因数ごとに現実的な上限が違うので、同じ物差しでは意味を持たない。
   例：AIは1回答で5〜9件しか引用しないので、オウンド引用率が90%になることは無い。
   閾値は config/settings.yaml の tiers で調整できる。 */
const TIER_FALLBACK=[85,70,55,40];
function tierOf(v,key){
  const b=((D&&D.tiers)||{})[key]||((D&&D.tiers)||{})._default||TIER_FALLBACK;
  if(v>=b[0])return{k:"s",g:"S",l:"ELITE"};
  if(v>=b[1])return{k:"a",g:"A",l:"STRONG"};
  if(v>=b[2])return{k:"b",g:"B",l:"STABLE"};
  if(v>=b[3])return{k:"c",g:"C",l:"WEAK"};
  return{k:"d",g:"D",l:"CRITICAL"};
}
/* 総合スコアだけは従来どおりの絶対評価（6因数の加重和なので分布が違う） */
function tierScore(v){return tierOf(v,"_score");}

/* センチメントの補正。
   パイプライン側は修正済みだが効くのは翌朝から。既存データでも正しい数字が出るよう
   画面側でも「意見が示されたときの肯定率」を計算する。中立は分母から外す。 */
function sentiNow(){
  if(D.sentiment_detail && D.sentiment_detail.opinionated)
    return D.sentiment_detail.positive/D.sentiment_detail.opinionated*100;
  let p=0,n=0;
  (D.queries||[]).forEach(q=>Object.values(q.surfaces||{}).forEach(v=>{
    if(v.sentiment==="positive")p++; else if(v.sentiment==="negative")n++;}));
  return (p+n)? p/(p+n)*100 : 50;
}
function sentiParts(){
  if(D.sentiment_detail) return D.sentiment_detail;
  let p=0,n=0,u=0;
  (D.queries||[]).forEach(q=>Object.values(q.surfaces||{}).forEach(v=>{
    if(v.rank==null&&!v.mention_rate)return;
    if(v.sentiment==="positive")p++; else if(v.sentiment==="negative")n++; else u++;}));
  return {positive:p,negative:n,neutral:u,opinionated:p+n,cells:p+n+u};
}
/* 表示用の因数値。センチメントだけ補正版を使う */
function facVal(k){ return k==="sentiment" ? sentiNow() : D.factors[k]; }
/* 総合スコアも補正後の因数で計算し直す。
   因数だけ直してスコアが旧定義のままだと、画面の中で数字が食い違う。
   パイプラインは修正済みなので、翌朝以降はこの計算と一致する。 */
function scoreNow(){
  const w=D.weights||{};
  return Object.keys(w).reduce((s,k)=>s+facVal(k)*w[k]/100,0);
}
function tierBadge(v){const t=tierScore(v);
  return `<div class="tier ${t.k}"><div class="tg">${t.g}</div><div class="tl">${t.l}</div></div>`;}

/* ---- セグメントゲージ ---- */
function gauge(v,n){n=n||10;const f=Math.round(v/100*n);
  return `<div class="gauge">${Array.from({length:n},(_,i)=>`<i class="${i<f?'f':''}" style="transition-delay:${i*45}ms"></i>`).join("")}</div>`;}

/* ---- レーダー（6因数） ---- */
function radar(vals,labels,size){
  size=size||300; const c=size/2, R=size*0.29, n=vals.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;
    return [c+Math.cos(a)*r, c+Math.sin(a)*r];};
  let g="";
  [1,.75,.5,.25].forEach(k=>{
    const p=Array.from({length:n},(_,i)=>pt(i,R*k).map(x=>x.toFixed(1)).join(",")).join(" ");
    g+=`<polygon class="rgrid" points="${p}"/>`;});
  for(let i=0;i<n;i++){const [x,y]=pt(i,R); g+=`<line class="rax" x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;}
  const pp=vals.map((v,i)=>pt(i,R*Math.max(v,3)/100).map(x=>x.toFixed(1)).join(",")).join(" ");
  g+=`<polygon class="rpoly" points="${pp}"/>`;
  vals.forEach((v,i)=>{const [x,y]=pt(i,R*Math.max(v,3)/100);
    g+=`<circle class="rdot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4"/>`;});
  labels.forEach((L,i)=>{const [x,y]=pt(i,R+30);
    const anc=Math.abs(x-c)<8?"middle":(x>c?"start":"end");
    g+=`<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${anc}">${esc(L)}</text>`;
    const [vx,vy]=pt(i,R+16);
    g+=`<text class="rv" x="${vx.toFixed(1)}" y="${(vy+3).toFixed(1)}" text-anchor="${anc}">${vals[i].toFixed(0)}</text>`;});
  return `<svg class="radar" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${g}</svg>`;
}

function toast(html,ms){const w=document.getElementById("toast");
  const d=document.createElement("div"); d.className="tst"; d.innerHTML=html; w.appendChild(d);

function bindStars(root){
  root.querySelectorAll(".star[data-star]").forEach(el=>el.onclick=e=>{
    e.stopPropagation();

  if(cs) cs.onclick=()=>{starOnly=!starOnly; render();};
}

/* プラットフォームをクリックしたとき、そのSNSが実際にどのクエリで
   引用されたか・そのときAIが何と答えたかを出す。 */
function openPlatform(pid){
  const pf=(D.platforms||[]).find(x=>x.id===pid)||{};
  const hits=[];
  (D.queries||[]).forEach(q=>{
    const cs=(q.citations||[]).filter(c=>c.platform===pid);
    if(!cs.length) return;
    const sf=cs[0].surfaces&&cs[0].surfaces[0];
    const sv=sf?q.surfaces[sf]:null;
    hits.push({q,cs,sf,sv});
  });
  hits.sort((a,b)=>(a.q.best_rank??99)-(b.q.best_rank??99));
  // 「引用されたその回答で」自社が出ていたか。クエリ全体の最良順位ではない点に注意。
  const own=hits.filter(h=>h.sv&&h.sv.rank!=null).length;
  const body=`
    <div class="g4" style="margin-bottom:14px">
      <div class="kpi"><div class="l">このSNSが引用されたクエリ</div><div class="v">${hits.length}</div><div class="d fl">本日のコア枠のうち</div></div>
      <div class="kpi own"><div class="l">うち自社が回答に出た</div><div class="v">${own}<small> / ${hits.length}</small></div><div class="d fl">自社シェア ${pf.share!=null?pf.share.toFixed(1):"—"}%</div></div>
      <div class="kpi"><div class="l">重み</div><div class="v">${((pf.weight||0)*100).toFixed(1)}<small>%</small></div><div class="d fl">アーンド引用率への寄与 ${((pf.weight||0)*(pf.share||0)).toFixed(2)}pt</div></div>
      <div class="kpi ${pf.actionable?'ok':'warn'}"><div class="l">自社で出稿できるか</div><div class="v" style="font-size:17px">${pf.actionable?"可能":"間接のみ"}</div><div class="d fl">${esc(pf.note||"")}</div></div>
    </div>
    ${hits.length?hits.map(h=>`<div class="dq">
      <div class="qt">${h.q.best_rank!=null?`<span class="rk ${h.q.best_rank===1?'r1':h.q.best_rank<=3?'r3':''}" style="width:19px;height:19px;font-size:10px;margin-right:6px">${h.q.best_rank}</span>`:'<span class="rk rx" style="width:19px;height:19px;font-size:10px;margin-right:6px">—</span>'}${esc(h.q.text)}</div>
      <div class="qm2">${CATJ[h.q.category]||h.q.category} ・ ${esc(h.q.driver_label||"")} ・ 引用されたAI ${(h.cs[0].surface_labels||[]).join(" / ")||"—"}</div>
      ${h.cs.map(c=>`<a class="cu" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title||c.url)}<br><span style="color:var(--sub)">${esc(c.url)}</span></a>`).join("")}

function starSummary(rows){

  let cells=0,hit=0,ranks=[],cited=0,gain=0,lost=0;
  sel.forEach(r=>{
    Object.values(r.surfaces||{}).forEach(v=>{
      cells++;
      if(v.rank!=null||v.mention_rate) hit++;
      if(v.rank!=null) ranks.push(v.rank);

    const tr=r.trend||{};

  const avg=ranks.length?ranks.reduce((a,b)=>a+b,0)/ranks.length:null;
  return `<div class="g4" style="margin-bottom:12px">

        <td style="font-size:11px">${(()=>{const ps=r.platforms||[];
          if(!ps.length) return '<span class="fl">—</span>';
          const lb=x=>(D.platforms.find(y=>y.id===x)||{}).label||x;
          return ps.slice(0,2).map(x=>`<span class="tag" title="${attr(lb(x))}">${esc(lb(x))}</span>`).join("")+
            (ps.length>2?`<span class="tag" title="${attr(ps.slice(2).map(lb).join("、"))}">＋${ps.length-2}</span>`:"");})()}</td>

              <div class="fact"><span class="fk">需要スコア</span><span class="fvv">${r.demand==null?"未計測":f1(r.demand)}</span></div>

              ${r.fanout_hits?`<div class="fact"><span class="fk">AIが自分で調べ直した</span><span class="fvv">${r.fanout_hits}回</span></div>`:""}
              <div class="fact"><span class="fk">テーマ</span><span class="fvv">${esc(CATJ[r.category]||r.category||"—")}</span></div>

            <div class="dettitle"><span class="di">!</span>検出されたネガ要因</div>
            <div>${r.negatives.map(n=>`<span class="pill p-ng" style="margin-right:6px">${esc(n)}</span>`).join("")}</div></div>`:""}

    }).join("")}</tbody></table></div>

}

function pageChurn(){

  if(!c.last_run) return `<h2 class="sec"><span class="bar"></span>クエリ新陳代謝</h2>
    <div class="card">まだ収穫を実行していません。<code>python src/harvest.py</code> で初回を回してください。</div>`;
  const R=c.rules||{}, W=c.weights||{}, hist=c.history||[];
  const qmap={};(D.queries||[]).forEach(q=>qmap[q.id]=q);
  const dbar=v=>`<span class="dbar"><i style="width:${Math.min(v||0,100)}%"></i></span>`;
  const row=(x,dir)=>`<div class="mv">
      <div class="ar ${dir>0?'up':'dn'}">${dir>0?'▲':'▼'}</div>
      <div><div class="tx">${esc(x.text)}</div>
        <div class="mt">${esc(x.source_label||'-')}${x.volume?` ・ 月間検索 ${num(x.volume)}`:""}${
          x.category?` ・ ${CATJ[x.category]||x.category}`:""}</div></div>
      <div class="dm">${x.demand==null?"—":f1(x.demand)}<small>需要スコア</small></div>
    </div>`;
  const co=D.cohort||{}, tot=D.counts.prompts||1, nnew=(D.queries||[]).filter(q=>q.is_new).length;
  const stable=tot-nnew;
  const mxh=Math.max(...hist.map(h=>Math.max(h.promoted,h.demoted,h.added)),1);

  return `<h2 class="sec"><span class="bar"></span>クエリ新陳代謝
    <span class="note">最終収穫 ${esc(c.last_run)}</span></h2>
  <div class="why"><b>これは何か：</b>クエリ一覧は固定ではありません。毎週、市場で実際に聞かれている質問を
  <b>Googleの検索候補・関連質問・知恵袋の実際の質問・AIが自分で調べ直した語</b>の4経路から集め、需要スコアの高い順に
  日次のコア枠を入れ替えています。<b>IDは絶対に振り直さない</b>ので、過去の時系列は切れません。</div>

  <div class="g4" style="margin-bottom:14px">
    <div class="kpi"><div class="l">今回の収穫候補</div><div class="v">${num(c.candidates)}</div><div class="d fl">重複除去まえ</div></div>
    <div class="kpi ok"><div class="l">新規登録</div><div class="v">${c.added.length}</div><div class="d fl">既存と重複しなかったもの</div></div>
    <div class="kpi own"><div class="l">コア枠に昇格</div><div class="v">${c.promoted.length}</div><div class="d fl">明日から日次で計測</div></div>
    <div class="kpi warn"><div class="l">急上昇で緊急投入</div><div class="v">${(c.surged||[]).length}</div><div class="d dn">通常ルールを飛ばした本数</div></div>
  </div>

  <h3 class="sub">スコアの分母が変わった影響をどう消しているか</h3>
  <div class="card" style="padding:15px 18px;margin-bottom:14px">
    <div class="cohortbar">
      <span style="flex:${stable};background:linear-gradient(90deg,#1B4470,#12324F)">基準コホート ${stable}本（${(stable/tot*100).toFixed(0)}%）</span>
      <span style="flex:${Math.max(nnew,0.001)};background:linear-gradient(90deg,#0E7C6B,#00A99D)">観察期間 ${nnew}本</span>
    </div>
    <div class="src" style="margin-top:9px">クエリを入れ替えると、施策と関係なく出現率が動いてしまいます。

  該当語を含むクエリの急上昇を優先的に拾います。</div>

  <h2 class="sec"><span class="bar"></span>新しく見つかったクエリ<span class="note">${c.added.length}本 — まだ月次枠で様子見</span></h2>

    <thead><tr><th style="width:110px">収穫日</th><th class="n" style="width:80px">新規</th>

/* ============================================================
   販売シェア × AI言及シェア
   「トヨタはAIで語られていない」という指摘に、母数を明示して答えるための図。
   軸を揃えるのが肝で、AI言及シェアの分母に入っているブランドだけで
   販売シェアも計算する。片方が8社・片方が6社だと比較そのものが成立しない。
   ============================================================ */
function salesVsAi(){
  if(!SALES||!SALES.brands) return null;
  const ai={}; (D.brands||[]).forEach(b=>ai[b.id]=b);
  const measured=SALES.brands.filter(s=>ai[s.id]);
  const missing =SALES.brands.filter(s=>!ai[s.id]);
  if(measured.length<3) return null;
  const aiTot=measured.reduce((t,s)=>t+(ai[s.id].mentions||0),0)||1;
  const slTot=measured.reduce((t,s)=>t+s.total,0)||1;
  const rows=measured.map(s=>({
    id:s.id, label:s.label, total:s.total,
    sales:s.total/slTot*100,
    aiShare:(ai[s.id].mentions||0)/aiTot*100,
    mentions:ai[s.id].mentions||0, note:s.note||""
  })).sort((a,b)=>b.sales-a.sales);
  rows.forEach(r=>r.diff=r.aiShare-r.sales);
  return {rows, missing, slTot, aiTot,
          period:SALES.period_label||SALES.period, sources:SALES.sources||[],
          definition:SALES.definition||""};
}

/* ============================================================
   テーマ × メーカーの出現率
   渡邉さんの第一要望。判断軸ではなく、日常的に使うテーマの軸で並べる。
   ============================================================ */
function themeMatrix(){
  const brands=(D.brands||[]).slice().sort((a,b)=>b.sov-a.sov);
  const cats={};
  (D.queries||[]).forEach(q=>{
    const c=q.category||"other";
    const e=cats[c]||(cats[c]={cells:0,hit:{},rank:{}});
    Object.values(q.surfaces||{}).forEach(sf=>{
      e.cells++;
      if(sf.rank!=null||sf.mention_rate){ e.hit.toyota=(e.hit.toyota||0)+1;
        if(sf.rank!=null)(e.rank.toyota=e.rank.toyota||[]).push(sf.rank); }
      Object.entries(sf.competitors||{}).forEach(([b,rk])=>{
        if(rk!=null){ e.hit[b]=(e.hit[b]||0)+1; (e.rank[b]=e.rank[b]||[]).push(rk); }});
    });
  });
  const order=(D.category_trend||[]).map(c=>c.id).filter(c=>cats[c]);
  Object.keys(cats).forEach(c=>{if(!order.includes(c))order.push(c);});
  const measured=brands.map(b=>b.id);
  const unmeasured=brands.filter(b=>!(D.queries||[]).some(q=>Object.values(q.surfaces||{})
      .some(sf=>(sf.competitors||{})[b.id]!=null)) && b.id!=="toyota" && !b.mentions);
  const pc=(h,n)=>n? h/n*100 : 0;
  const rows=order.map(c=>{
    const e=cats[c];
    const vals=measured.map(b=>({id:b, rate:pc(e.hit[b]||0,e.cells),
      avg:(e.rank[b]&&e.rank[b].length)?e.rank[b].reduce((a,x)=>a+x,0)/e.rank[b].length:null}));
    const top=vals.slice().sort((a,b)=>b.rate-a.rate)[0];
    const mine=vals.find(v=>v.id==="toyota")||{rate:0};
    return {c,e,vals,top,mine,gap:mine.rate-top.rate};
  });
  const bl={}; brands.forEach(b=>bl[b.id]=b.label);
  return `<div class="card"><div class="tw" style="max-height:none;border:0"><table class="hm">
    <thead><tr><th style="width:132px">テーマ</th><th class="c" style="width:56px">セル数</th>
      ${measured.map(b=>`<th class="c${b==="toyota"?" meco":""}" style="width:74px">${esc(bl[b]||b)}</th>`).join("")}
      <th class="c" style="width:92px">首位</th><th class="c" style="width:78px">自社との差</th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td><b>${esc(CATJ[r.c]||r.c)}</b></td>
      <td class="c" title="このテーマのクエリ×AI面の総数。出現率の分母です">${r.e.cells}</td>
      ${r.vals.map(v=>{
        const lead=(v.id===r.top.id&&r.top.rate>0), own=v.id==="toyota";
        const q=Math.min(5,Math.ceil(v.rate/100*5));
        return `<td class="h h${v.rate?q:0}${own?" meco":""}${lead?" lead":""}"
          title="${esc(bl[v.id]||v.id)}：${r.e.cells}セル中 ${Math.round(v.rate/100*r.e.cells)}セルで登場">
          ${v.rate?v.rate.toFixed(0)+"%":"—"}
          <span class="rk">${v.avg?v.avg.toFixed(1)+"位":""}</span></td>`;}).join("")}
      <td class="c">${r.top.rate>0?`<b>${esc(bl[r.top.id]||r.top.id)}</b><br><span style="font-size:10px;color:var(--sub)">${r.top.rate.toFixed(0)}%</span>`:"—"}</td>
      <td class="c">${r.gap>=0?'<span class="up" style="font-weight:700">首位</span>'
        :`<span class="dn" style="font-weight:700">${r.gap.toFixed(0)}pt</span>`}</td>
    </tr>`).join("")}</tbody></table></div>
    <div class="note ng" style="margin-bottom:0">
      セルの数字は<b>そのテーマのクエリ×AI面のうち、そのブランドが回答に登場した割合</b>です。小さい数字は登場したときの平均順位。
      分母は行ごとに違うので「セル数」列で確認してください。
      ${unmeasured.length?`<br><b class="hl">${unmeasured.map(b=>esc(b.label)).join("・")} は本日時点で未計測です。</b>翌日の実行から数字が入ります。`
        :`<br>計測対象は ${measured.length} 社です。`}
    </div></div>`;
}
/* ============================================================
   競合のデイリー推移
   スコアの上下だけ見ていても「自社が落ちたのか、競合が伸びたのか」が分からない。
   言及回数の実数と、販売シェアとの差（＝規模に対する過不足）を日次で並べる。
   ============================================================ */
const BCOL=["#0B6FB4","#D8232F","#8B5CF6","#F59E0B","#10B981","#EC4899","#64748B","#14B8A6"];
function brandSeries(metric){
  const bs=(D.brands||[]).slice().sort((a,b)=>b.sov-a.sov);
  const me=bs.findIndex(b=>b.id==="toyota");
  if(me>0) bs.unshift(bs.splice(me,1)[0]);          // 自社を必ず先頭（主線）に
  const ids=bs.map(b=>b.id);
  const rows=(D.history||[]).filter(h=>h&&h.brands).map(h=>{
    const o={date:h.date,mode:h.mode};
    ids.forEach(id=>o[id]=(h.brands[id]||{})[metric]);
    return o;});
  return {rows, ids, labels:bs.map(b=>b.label), brands:bs};
}
function gapSeries(){
  const S=salesVsAi(); if(!S) return null;
  const ids=S.rows.map(r=>r.id);
  const sales={}; S.rows.forEach(r=>sales[r.id]=r.sales);
  const lab={};  S.rows.forEach(r=>lab[r.id]=r.label);
  const rows=(D.history||[]).filter(h=>h&&h.brands).map(h=>{
    const tot=ids.reduce((t,id)=>t+((h.brands[id]||{}).mentions||0),0);
    const o={date:h.date,mode:h.mode};
    ids.forEach(id=>o[id]=tot?((h.brands[id]||{}).mentions||0)/tot*100-sales[id]:null);
    return o;});
  const me=ids.indexOf("toyota");

function cssq(v){ return (window.CSS&&CSS.escape)?CSS.escape(v):String(v).replace(/["\\]/g,"\\$&"); }
function focusRow(id,flash){
  const tr=document.querySelector(`tr.qrow[data-q="${cssq(id)}"]`);
  if(!tr) return false;
  const tw=tr.closest(".tw");
  if(tw){
    tw.scrollTop=Math.max(0,tr.offsetTop-tw.clientHeight/3);
    tw.scrollIntoView({block:"center",behavior:"smooth"});
  }else tr.scrollIntoView({block:"center",behavior:"smooth"});
  if(flash!==false){ tr.classList.remove("flash"); void tr.offsetWidth; tr.classList.add("flash"); }
  return true;
}

function animateBars(root){

function countUp(root){
  root.querySelectorAll("[data-count]").forEach(el=>{
    const raw=el.dataset.count, to=parseFloat(raw);
    if(isNaN(to)) return;
    const dec=(raw.split(".")[1]||"").length; let t0=null;
    function step(ts){ if(!t0)t0=ts; const k=Math.min((ts-t0)/850,1);
      const e=1-Math.pow(1-k,3); el.textContent=(to*e).toFixed(dec);
      if(k<1)requestAnimationFrame(step); }
    requestAnimationFrame(step);});
}
function reveal(root){
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),
    {threshold:.05,rootMargin:"0px 0px -40px 0px"});
  const els=[...root.querySelectorAll(".card,.tw,.why,.faq,.defs,h2.sec")];
  els.forEach((el,i)=>{el.classList.add("rv"); el.style.transitionDelay=Math.min(i,6)*35+"ms"; io.observe(el);});
  // 保険：1.2秒後に未表示のものは強制的に出す（印刷・スクショ・短いページ対策）
  setTimeout(()=>els.forEach(el=>el.classList.add("in")),1200);
}
function bindCharts(root){
  const tip=document.getElementById("tip");
  root.querySelectorAll("svg.lchart").forEach(svg=>{
    let pts,labels,colors;
    try{pts=JSON.parse(svg.dataset.pts);labels=JSON.parse(svg.dataset.labels);colors=JSON.parse(svg.dataset.colors);}
    catch(e){return;}
    if(!pts||!pts.length) return;
    const cur=svg.querySelector(".cursor"), dot=svg.querySelector(".hoverdot");
    svg.addEventListener("mousemove",ev=>{
      const r=svg.getBoundingClientRect(), x=(ev.clientX-r.left)/r.width*640;
      let best=pts[0],bd=1e9;
      pts.forEach(pp=>{const dd=Math.abs(pp.x-x); if(dd<bd){bd=dd;best=pp;}});
      cur.setAttribute("x1",best.x); cur.setAttribute("x2",best.x); cur.style.opacity=".9";
      dot.setAttribute("cx",best.x); dot.setAttribute("cy",best.y); dot.style.opacity="1";
      const idx=pts.indexOf(best), prev=pts[idx-1];
      let html=`<b>${best.d}</b>`;
      best.vals.forEach((v,i)=>{ if(v==null) return;
        html+=`<br><span style="color:${colors[i]}">■</span> ${labels[i]||""} <b>${(+v).toFixed(1)}</b>`;
        if(i===0&&prev&&prev.vals[0]!=null){const dd=v-prev.vals[0];
          html+=` <span style="color:${dd>=0?'#7FE0B6':'#F4A3A3'}">(${dd>=0?"+":""}${dd.toFixed(2)})</span>`;}});
      tip.innerHTML=html; tip.style.opacity="1";
      const tw=tip.offsetWidth||180;
      tip.style.left=Math.min(ev.clientX+14,window.innerWidth-tw-12)+"px";
      tip.style.top=(ev.clientY-12)+"px";
    });
    svg.addEventListener("mouseleave",()=>{
      tip.style.opacity="0"; cur.style.opacity="0"; dot.style.opacity="0";});
  });
}

/* ===== 説明ブロックの折りたたみ ===== */
function foldWhy(root){
  root.querySelectorAll(".why").forEach(el=>{
    if(el.dataset.done)return; el.dataset.done="1";
    if(el.style.cursor==="default")return;
    const html=el.innerHTML;
    const m=html.match(/^\s*<b>([^<]{2,40})<\/b>/);
    const title=m?m[1].replace(/[:：]$/,""):"この画面の見方";
    el.innerHTML=`<div class="wt"><span class="qm" style="width:15px;height:15px;font-size:10px">?</span>${esc(title)}<span class="ar">▼</span></div><div class="wb">${html}</div>`;
    el.onclick=()=>el.classList.toggle("op");
  });
}

/* ===== コマンドパレット（⌘K / Ctrl+K） ===== */
const pal=document.getElementById("pal"),palin=document.getElementById("palin"),pallist=document.getElementById("pallist");
let palItems=[],palSel=0;
function buildPalItems(){
  const navs=[...document.querySelectorAll(".side .nav")].map(a=>({
    t:a.textContent.replace("核","").trim(), k:"ページ", go:()=>a.click()}));
  const qs=(D?.queries||[]).slice(0,400).map(q=>({
    t:q.text, k:"クエリ", go:()=>{
      jumpToQuery(q.id);}}));
  const ps=(D?.owned_pages||[]).map(o=>({t:o.path+"  "+(o.title||""),k:"自社ページ",
    go:()=>document.querySelector('.side .nav[data-p="pages"]').click()}));
  return [...navs,...qs,...ps];
}
function renderPal(q){
  const all=palItems.filter(i=>!q||i.t.toLowerCase().includes(q.toLowerCase())).slice(0,40);
  palSel=Math.min(palSel,Math.max(all.length-1,0));
  pallist.innerHTML=all.map((i,n)=>`<div class="pitem ${n===palSel?'sel':''}" data-n="${n}">
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.t).slice(0,110)}</span>
    <span class="pk">${i.k}</span></div>`).join("")||'<div class="pitem">該当なし</div>';
  pallist.querySelectorAll(".pitem[data-n]").forEach(el=>el.onclick=()=>{closePal();all[+el.dataset.n].go();});
  pal._cur=all;
}
function openPal(){palItems=buildPalItems();pal.classList.add("on");palin.value="";palSel=0;renderPal("");palin.focus();}
function closePal(){pal.classList.remove("on");}
document.getElementById("palBtn").onclick=openPal;
pal.onclick=e=>{if(e.target===pal)closePal();};
palin.oninput=()=>{palSel=0;renderPal(palin.value);};
document.addEventListener("keydown",e=>{
  const inField = /^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||"");
  if(e.key==="Escape"){closeModal(); if(inField)e.target.blur();}
  if(!inField && !pal.classList.contains("on") && !e.metaKey && !e.ctrlKey){
    if(e.key==="/"){const q=document.getElementById("qq"); if(q){e.preventDefault();q.focus();q.select();return;}}
    if(/^[1-8]$/.test(e.key)){
      const navs=[...document.querySelectorAll(".side .nav")];
      const t=navs[+e.key-1]; if(t){e.preventDefault();t.click();return;}
    }
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();pal.classList.contains("on")?closePal():openPal();return;}
  if(!pal.classList.contains("on"))return;
  if(e.key==="Escape")closePal();
  if(e.key==="ArrowDown"){e.preventDefault();palSel++;renderPal(palin.value);}
  if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);renderPal(palin.value);}
  if(e.key==="Enter"){const c=pal._cur||[];if(c[palSel]){closePal();c[palSel].go();}}
});

/* 販売会社（DMS）のドメイン判定。
   パイプライン側でも同じ判定を入れてあるが、そちらが効くのは翌朝のバッチから。
   その日から画面で使えるように、既存データに対しては画面側でも判定する。
   bucket:"dealer" が付いているデータでは、こちらは使われない。 */
const DEALER_RE=[
  /(^|\.)toyota-mobi-[^.]+\.(jp|co\.jp)$/, /(^|\.)toyota-mobility-[^.]+\.(jp|co\.jp)$/,
  /(^|\.)toyota-united[^.]*\.co\.jp$/,     /(^|\.)weins-toyota-[^.]+\.co\.jp$/,
  /[a-z0-9-]+toyota\.(jp|co\.jp)$/,        /(^|\.)gtoyota\.com$/,
  /(^|\.)corolla-[^.]+\.(jp|net|co\.jp)$/, /\.corolla\.co\.jp$/,
  /[a-z0-9-]*corolla[a-z0-9-]*\.jp$/,      /(^|\.)t-corolla\.co\.jp$/,
  /toyopet/,                                /\.toyota-dealer\.jp$/,
  /(^|\.)netz[a-z0-9-]*\.(com|jp)$/,       /[a-z0-9-]*netz[a-z0-9-]*\.jp$/,
  /(^|\.)k-toyota\.co\.jp$/
];
const AFFIL_RE=[/(^|\.)global\.toyota$/,/(^|\.)toyota\.co\.jp$/,/(^|\.)lexus\.jp$/,
                /(^|\.)kinto-jp\.com$/,/(^|\.)gazoo\.com$/];
function bucketOf(c){
  const b=c.bucket;
  if(b==="owned") return "owned";
  if(b==="dealer") return "dealer";                 // パイプラインが分類済み
  const h=(c.host||"").replace(/^www\./,"").toLowerCase();
  if(b==="affiliated"||b==="media"){
    if(DEALER_RE.some(r=>r.test(h))) return "dealer";
    if(AFFIL_RE.some(r=>r.test(h)))  return "affiliated";
  }
  return b;
}
const SCOPES={
  owned :{label:"toyota.jp のみ", set:new Set(["owned"]),
          desc:"自社が直接運営しているページだけ。GEOスコアの計算はこの定義です"},
  dealer:{label:"販売店（DMS）", set:new Set(["dealer"]),
          desc:"トヨタモビリティ・カローラ店・ネッツ店などの販売会社サイト。運営が別会社なので打ち手も別になります"},
  group :{label:"グループ会社", set:new Set(["affiliated"]),
          desc:"KINTO・GAZOO・global.toyota・レクサスなど。自社関連だが toyota.jp ではありません"},
  all   :{label:"3つの合計", set:new Set(["owned","dealer","affiliated"]),
          desc:"toyota.jp・販売店・グループ会社のいずれかが根拠に引かれた割合"}
};
let scope=localStorage.getItem("geo.scope")||"owned";
if(!SCOPES[scope]) scope="owned";

/* 自社が言及されたセルのうち、指定した陣営のドメインが根拠に引かれた割合。
   scope="owned" のとき、パイプラインが出す factors.owned_citation と一致する。 */
function ownedRate(sc){
  const want=SCOPES[sc].set;
  let tot=0,hit=0;
  (D.queries||[]).forEach(q=>{
    Object.entries(q.surfaces||{}).forEach(([sf,v])=>{
      if(v.rank==null && !v.mention_rate) return;      // 自社未言及のセルは分母から外す
      tot++;
      const cs=(q.citations||[]).filter(c=>(c.surfaces||[]).includes(sf));
      if(cs.some(c=>want.has(bucketOf(c)))) hit++;
    });
  });
  return tot? hit/tot*100 : 0;
}
function scopeCells(){
  let n=0;
  (D.queries||[]).forEach(q=>Object.values(q.surfaces||{}).forEach(v=>{
    if(v.rank!=null||v.mention_rate) n++;}));
  return n;
}

/* 重点クエリ。IDは仕様上振り直されないので、日をまたいでも同じクエリを指す。 */
let stars=new Set(JSON.parse(localStorage.getItem("geo.star")||"[]"));
let starOnly=false;
function toggleStar(id){
  stars.has(id)?stars.delete(id):stars.add(id);
  localStorage.setItem("geo.star",JSON.stringify([...stars]));
}
