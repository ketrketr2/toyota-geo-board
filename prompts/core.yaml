# ============================================================
#  コアプロンプト（日次実行枠）
#
#  設計原則:
#   1. 生活者の言葉であること（名詞の羅列は禁止）
#   2. brand: false（一般クエリ）を7割以上にすること
#   3. 購買判断に効くこと（IR・採用系は除外）
#   4. driver に high 優先度（safety / urban / adas）を必ず含めること
#
#  出典: Yahoo!知恵袋の実質問文を整形 + Google PAA/サジェスト + GSC実クエリ
# ============================================================

version: 1
tier: core

prompts:
  # ---- 購買検討（ライフステージ起点）----
  - id: p001
    text: "ミニバンのおすすめを教えてください。2歳の子供がいて、もう1人産まれる予定です。今はプリウスですが、チャイルドシートの乗せ下ろしがきつく、2人乗せると狭く感じます。予算は400万円までです。"
    category: purchase
    driver: minivan
    brand: false
    source: chiebukuro
  - id: p002
    text: "家族4人で高速道路中心に旅行する場合、静かで燃費も良い国産車ブランドを教えてください。"
    category: purchase
    driver: hybrid
    brand: false
    source: semrush_import
  - id: p003
    text: "高齢の親用に買い替えを検討しています。乗り降りしやすくて視界が良く、安全装備が充実している国産車ブランドを教えてください。"
    category: safety
    driver: safety
    brand: false
    source: semrush_import
  - id: p004
    text: "子育てが落ち着いてセカンドライフ用の車に乗り換えるシニアが、日本でよく選ぶブランドはどこでしょう？"
